[General]
ruta_astap = C:\\Program Files\\Astap\\astap.exe
lanzar_stellarium_al_arrancar = true
ruta_stellarium = C:\\Program Files\\Stellarium\\stellarium.exe
altura_minima = 5
; false = sin activacion ni periodo de prueba (para pruebas). true = exigir clave de activacion.
activacion_requerida = false
palabra_clave_goto = ir a
astrometry_api_key = 

[Dispositivos]
driver_camara = ASCOM.PlayerOne.Camera
binning_camara = 1
exposicion_captura = 25
; Ganancia de la camara para lights, darks, flats y centrado. Vacio = no tocarla
; (queda la del driver ASCOM). Si se cambia hay que generar darks nuevos.
ganancia_camara = 
numero_maximo_imagenes = 20
numero_darks = 10
intervalo_evolucion = 5
driver_telescopio = ASCOM.SynScanMobile.Telescope
focal_len = 250
color_intensity = 2
; Campo visible (zoom): porcentaje que se quita por los bordes de la vista previa y
; del JPG de la galeria. 0 = campo completo, 50 = se ve el 50 %, 75 = el 25 %.
; El apilado y el FITS siguen a campo completo.
zoom_preview = 0

[Observatorio]
latitud_observatorio = 0
longitud_observatorio = 0
altitud_observatorio = 0
; Autor de las fotos (se pinta en la firma)
autor = 

[FTP]
host = 
usuario = 
contrasena = 
ruta_remota = 
subir_ftp = true

[Usuarios]
admin = 


[Centrado]
tolerancia_arcmin = 3
max_vueltas = 3
exposicion_centrado = 5
sync_primera_vuelta = true
; Centrar automaticamente con plate solving al terminar cada GOTO (como un Seestar)
centrar_tras_goto = true
; vacio = el asentamiento_s general de [Montura]
asentamiento_s =

[Voz]
activada = true
anunciar_capturas = true
volumen = 100
velocidad = 0
voz = 
anunciar_ip = true
intervalo_anuncio_ip = 30

[Montura]
; Al conectar, borrar en la app SynScan Pro las sincronizaciones y el modelo de
; apuntado de sesiones anteriores (comando ASCOM Action "ClearSyncTo").
limpiar_sync_al_conectar = true
; Segundos de espera tras cada movimiento (GOTO, centrado, dithering, alineacion,
; Apunta aqui) antes de la siguiente foto, para que la montura deje de vibrar.
; Se ajusta en Configuracion > Montura.
asentamiento_s = 5

[Alineacion]
; Alineacion automatica de varios puntos por plate solving
puntos = 6
altura_maxima = 65
altura_minima = 35
; vacio = el asentamiento_s general de [Montura]
asentamiento_s =
limpiar_antes = true

[Procesado]
; Estilo de procesado del apilado: natural | seestar | agresivo. Los valores
; siguientes, si se rellenan, mandan sobre los del estilo (0-1 salvo saturacion).
estilo = seestar
ruido = 
contraste = 
saturacion = 
scnr = 
gradiente = 
aplanar = 

[Flats]
numero_flats = 10
numero_flat_darks = 5
; nivel medio objetivo del flat como fraccion del rango (0.40 = 40 %)
nivel_objetivo = 0.40
exposicion_inicial = 1.0
exposicion_minima = 0.02
exposicion_maxima = 15

[Dithering]
; Mover la montura unos pixeles al azar cada N fotos del apilado
activado = false
cada_n_fotos = 3
amplitud_px = 15
; vacio = el asentamiento_s general de [Montura]
asentamiento_s =

[Apilado]
; Metrica de calidad de cada foto: estrellas (rapida, sin dependencias) o photutils
; (DAOStarFinder, la de la version de junio). Una foto por debajo de
; umbral_calidad x media de las top_para_umbral mejores se descarta.
metrica_calidad = estrellas
umbral_calidad = 0.5
top_para_umbral = 10
fwhm_px = 2.5
; Firma en la vista previa y en las fotos de la galeria: logo, autor, lugar, fecha,
; objeto, tiempo de integracion y coordenadas (el FITS se guarda sin firma)
firma = true
; Anotar los objetos del catalogo sobre la vista previa (se cambia desde la pantalla Apilado)
objetos_anotados = false

[Recorrido]
; Recorrido por constelacion: centrar con plate solving en cada objeto
centrar = false
espera_centrado_s = 120

[Interfaz]
; Preferencias de las pantallas, las escribe la propia app (orden y plegado de los
; paneles de Apilado, opcion de darks al empezar). No hace falta tocarlas a mano.

[FotoDia]
; Ultima exposicion (s) que funciono en el modo dia de la Foto de prueba, por objetivo.
; Las escribe la propia app para empezar la siguiente busqueda cerca del valor bueno.
exposicion_sol =
exposicion_luna =
exposicion_paisaje =

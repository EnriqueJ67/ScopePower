[Procesado]
; Estilo de procesado del apilado: natural | seestar | agresivo. Los valores
; siguientes, si se rellenan, mandan sobre los del estilo (0-1 salvo saturacion).
estilo = seestar
; Al apuntar a un objeto, cargar el preset de su familia si existe uno con ese
; nombre (Galaxias, Nebulosas, Cumulos...): true | false
preset_automatico = true
; Al guardar un apilado en la galeria, separar las estrellas con StarNet2 (si esta
; instalado, [General] ruta_starnet) y procesar el objeto y las estrellas aparte:
; true | false. Tarda varios minutos mas por foto (unos 4 en un PC de sobremesa solo
; con CPU, bastantes mas en un mini PC); con false se puede hacer despues desde el
; editor de la galeria, foto a foto.
estrellas_aparte = false
ruido = 
contraste = 
saturacion = 
scnr = 
gradiente = 
aplanar = 
; Estirado adaptativo multiescala (de lineal a no lineal). Vacio = el del estilo.
; fondo_objetivo: brillo del fondo de cielo en la imagen final (0.10-0.20; mas con nebulosas extensas)
; agresividad:    0-1, cuanto se acerca el punto negro al pico del fondo (mas = mas contraste y ruido)
; compresion:     0-1, proteccion de estrellas y nucleos (0 = igual que el STF clasico, 1 = nada se recorta)
; recuperacion:   peso del detalle fino (1 = el contraste que daria una curva global)
; escala:         tamano en px por encima del cual una estructura se trata como fondo (1024)
; curva:          gamma (por defecto) | asinh | mtf, familia de la curva del fondo
; brillo:         -1..1, curva de medios sobre la imagen final (0 = sin cambio)
; temperatura:    -1..1, tonalidad de objetos y estrellas: <0 mas azul, >0 mas rojo (el fondo sigue neutro)
; curvas:         curvas por puntos de control (panel Curvas del apilado y del editor), en JSON:
;                 {"rgb": [[x, y], ...], "r": [...], "g": [...], "b": [...]} con x e y entre 0 y 1. Vacio = ninguna
fondo_objetivo = 
agresividad = 
compresion = 
recuperacion = 
escala = 
curva = 
brillo = 
temperatura = 
curvas = 

[Flats]
numero_flats = 10
numero_flat_darks = 5
; nivel medio objetivo del flat como fraccion del rango (0.40 = 40 %)
nivel_objetivo = 0.40
exposicion_inicial = 1.0
exposicion_minima = 0.02
exposicion_maxima = 15

[Dithering]
; Mover la montura unos pixeles al azar cada N fotos del apilado. Cada movimiento va a un
; punto al azar a hasta amplitud_px del punto de partida (no se aleja con la noche)
activado = false
cada_n_fotos = 3
amplitud_px = 15
; grados/s maximos por eje al moverse con MoveAxis (vacio = 0.1); 0 = moverse con GoTo,
; que en la AZ GoTo se pasa unos 25' y vuelve
velocidad_deg_s =
; vacio = el asentamiento_s general de [Montura]
asentamiento_s =

[Apilado]
; Objetos anotados: ademas de los populares, los NGC e IC del catalogo local hasta esta
; magnitud (0 = no anotarlos). Se cambia tambien en Apilado > Opciones.
anotar_ngc_hasta_mag = 14
; Metrica de calidad de cada foto: estrellas (rapida, sin dependencias) o photutils
; (DAOStarFinder, la de la version de junio). Una foto por debajo de
; umbral_calidad x media de las top_para_umbral mejores se descarta.
metrica_calidad = estrellas
umbral_calidad = 0.5
top_para_umbral = 10
fwhm_px = 2.5
; Como se combinan las fotos:
;   mejores     = sigma-clip de las numero_maximo_imagenes mejores; con cada foto se
;                 reapilan todas (el tiempo por foto crece con el numero de fotos)
;   incremental = las primeras fotos_referencia fotos BUENAS fijan la referencia (media
;                 y ruido de cada pixel); cada foto nueva se compara con ella, se quitan
;                 los pixeles que se apartan mas de sigma_incremental sigmas (satelites,
;                 aviones, rayos cosmicos) y se suma. Tiempo fijo por foto y sin tope de
;                 fotos (numero_maximo_imagenes solo cuenta en el plan de la noche), pero
;                 una foto que ya ha entrado no se puede quitar
;                 fotos_referencia: minimo 6 (con menos, el sigma-clip de la referencia
;                 no puede rechazar nada); 10 va bien, mas de 15 apenas mejora
;                 umbral_referencia: antes de fijar la referencia se repasan sus fotos y
;                 las que no llegan a umbral_referencia x media de la mejor mitad se
;                 apartan y se suman despues (0 = sin repaso; 0.6 aparta 0-3 fotos
;                 en una noche normal, mas alto retrasa la referencia)
modo_apilado = mejores
fotos_referencia = 10
sigma_incremental = 3.0
umbral_referencia = 0.6
; Rastros de satelites y aviones (lineas largas y finas) y luces parasitas (una
; linterna o unos faros que suben el fondo solo en una foto): la puntuacion se
; multiplica por penalizacion_defectos y la foto no entra en el apilado
detectar_rastros = true
detectar_luces = true
penalizacion_defectos = 0.1
; Las fotos descartadas por un rastro se guardan aparte (Galeria > Rastros) con su
; tipo (avion, satelite o posible meteoro) para rescatar los meteoros. Como mucho
; max_rastros: se borran antes los aviones y satelites antiguos. Sin FITS si hay poco disco.
guardar_rastros = true
max_rastros = 50
; Firma en la vista previa y en las fotos de la galeria: logo, autor, lugar, fecha,
; objeto, tiempo de integracion y coordenadas (el FITS se guarda sin firma)
firma = true
; Anotar los objetos del catalogo sobre la vista previa (se cambia desde la pantalla Apilado)
objetos_anotados = false


[Cometa]
; Apilado por el nucleo del cometa, en paralelo al apilado normal (cometa.py). Cuando el
; objeto del GoTo es un cometa (tipo Cometa de la ficha, o nombre C/2023 A3, 12P/...) cada
; foto se alinea dos veces: por las estrellas (apilado normal, el cometa sale corrido) y por
; el nucleo (las estrellas salen como rastros y el cometa queda fijo). En la pantalla
; Apilado se elige cual ver con los chips Estrellas / Cometa y al guardar en la galeria
; se guardan las dos (<objeto>_<fecha>_nucleo). Cuesta unos segundos mas por foto.
;   activo = auto | si | no   (auto: solo si el objeto apuntado es un cometa)
activo = auto
; Donde esta el nucleo: previsto por las efemerides del MPC (cuerpos_menores, sin Internet)
; y medido en cada foto como la condensacion mas brillante que no sea una estrella.
; radio_busqueda: px alrededor de la prevision en la primera foto (la efemerides falla
; minutos de arco; 80 px son 4' con la Saturn-C y el Evoguide). radio_centroide: px del
; centroide del nucleo. apertura: px del disco de la apertura morfologica que quita las
; estrellas (hasta ~5 px de anchura; subirlo si quedan estrellas gordas, bajarlo con cometas muy pequenos).
; suavizado: sigma (px) del suavizado posterior. minimo_sigma: el nucleo debe superar el
; fondo en tantos sigmas; si no, se usa la prevision.
radio_busqueda = 80
radio_centroide = 8
apertura = 11
suavizado = 4
minimo_sigma = 5
; La vista previa del cometa (estirado completo, varios segundos en el mini PC) se hace cada
; N fotos; el FITS se actualiza con todas. 1 = con cada foto, como el apilado normal.
vista_previa_cada = 1

[Recorrido]
; Recorrido por constelacion: centrar con plate solving en cada objeto
centrar = false
espera_centrado_s = 120

[Interfaz]
; Preferencias de las pantallas, las escribe la propia app (orden y plegado de los
; paneles de Apilado, opcion de darks al empezar). No hace falta tocarlas a mano.
; Idioma de las pantallas y de la voz del PC: es (espanol) | en (English). Se elige en el
; primer paso del asistente o en Configuracion > Idioma.
; App language (screens and PC voice): es | en. Set it in the first step of the setup
; wizard or in Settings > Language.
idioma = es
; true = lo que falta por traducir sale marcado entre signos de interrogacion dobles (para quien traduce)
idioma_depurar = false

[FotoDia]
; Ultima exposicion (s) que funciono en el modo dia de la Foto de prueba, por objetivo.
; Las escribe la propia app para empezar la siguiente busqueda cerca del valor bueno.
exposicion_sol =
exposicion_luna =
exposicion_paisaje =
; Guiado por el disco del Sol o la Luna (Camara, modo dia): la montura se corrige cuando el
; disco se aparta mas de estos minutos de arco de donde estaba (el Sol mide 32'). Minimo 0,5.
guiado_umbral_arcmin = 2
; Como se corrige: moviendo los ejes a esta velocidad maxima (grados/segundo, MoveAxis) en
; bucle cerrado con los codificadores. Un GoTo corto hace que la AZ GoTo se pase unos 25' y
; vuelva (13 s de bandazo que saca el disco del encuadre); con los ejes recorre lo justo.
; 0 = corregir con GoTo como antes. Si la montura no responde a MoveAxis se usa el GoTo.
; Mientras se graba un video la correccion espera (hasta 3 veces el umbral).
guiado_velocidad_deg_s = 0.1

[Seguimiento]
; Seguimiento EXPERIMENTAL de objetos en movimiento (aviones, satelites, ISS) con la camara
; como guia (SDK nativo de Player One) y correccion continua de la velocidad de los ejes.
; backend: ascom (MoveAxis via SynScan Pro) | udp (protocolo Sky-Watcher directo al modulo wifi)
backend = ascom
udp_host = 192.168.4.1
udp_puerto = 11880
; Con simulador = true la camara y la montura son falsas (para probar la pagina sin equipo):
; velocidad y rumbo del objeto simulado, giro real de la camara y retardo de la montura
simulador = false
sim_v_obj = 0.6
sim_rumbo = 20
sim_angulo = 25
sim_retardo_s = 0.3
; Camara: ROI cuadrado en pixeles del sensor, binning, formato (RAW8 | RAW16), exposicion y ganancia
; Campo: 3008 = sensor entero (2,5 grados con el Evoguide 50, buscar es mas facil); 1504 = 1,25; 1024 = 0,85
roi_px = 3008
binning = 2
formato = RAW8
exposicion_ms = 5
ganancia = 300
; Exposicion automatica guiada por el objeto seguido (pico en torno a pico_objetivo, solo toca la exposicion)
exposicion_auto = true
exposicion_min_ms = 0.1
exposicion_max_ms = 50
pico_objetivo = 0.7
; Contraste minimo del pico sobre el fondo (de 255) para que una mancha cuente: descarta el ruido
contraste_min = 20
fps_camara = 15
; Controlador: ordenes por segundo a la montura, ganancias PI, velocidad maxima de eje (grados/s)
frecuencia_hz = 4
kp = 0.6
ki = 0.3
v_max = 4
; Segundos manteniendo la velocidad tras perder el objeto antes de parar
perdida_s = 3
; Backend ASCOM: intervalo minimo entre MoveAxis distintos y cambio minimo que se manda (grados/s)
intervalo_ascom_s = 0.4
banda_muerta = 0.02
; Medido con la AZ GoTo real (sept 2026): por UDP en modo lento el eje arranca en 140 ms, cambia de
; velocidad en caliente y llega a 0,81 grados/s; el modo rapido tarda mas de 1 s en arrancar. Por ASCOM
; el driver pasa a rapido a partir de 0,53 grados/s, asi que ese camino se limita a v_max_ascom.
udp_permitir_rapido = false
v_max_ascom = 0.5
; Vista previa para la web: ancho en px y veces por segundo
vista_previa_px = 400
vista_previa_hz = 2
; Altura minima para seguir, en grados; vacia = sin limite (luces lejanas, objetivos terrestres)
altura_minima_seguimiento =
; Grabar los fotogramas del seguimiento en el disco del mini PC: formato ser (crudo, para apilar),
; mp4 (para ver) o ambos; desde que bloquea el objeto (bloqueo) o desde el inicio (inicio)
grabar = false
formato_video = ser
grabar_desde = bloqueo
carpeta_video = videos
; Lado del recorte centrado que se graba, en pixeles del fotograma (0 = entero; con el campo amplio son ~2 GB/min)
video_lado = 640
; Video en color: pone la camara a binning 1 (el mismo campo, con fotogramas cuatro veces mayores)
color = false

[Video]
; Video del Sol o la Luna desde el modo en vivo de Camara (boton «Grabar video») y apilado de
; los mejores fotogramas (panel Video). Se graba en SER crudo (RAW16, binning 1, el recorte del
; vivo) en la carpeta del mini PC; a la tablet solo llega el apilado. Con el recorte del 35 %
; (1052 px) son unos 2,7 GB por minuto a 20 fotogramas/s.
; Cadencia de la camara mientras se graba (la vista sigue a 5 fotogramas/s)
fps = 20
; Duracion de serie de cada grabacion, en segundos (0 = hasta pulsar Parar)
duracion_s = 120
; Tanto por ciento de los fotogramas mas nitidos que se apilan (nunca menos de 10 fotogramas)
mejores_pct = 25
; Afinado del apilado, 0 (nada) a 3: deconvolucion del disco con el desenfoque medido en su
; limbo, 4 iteraciones por punto (sin disco, mascara de desenfoque)
nitidez = 1
; Carpeta de los videos (relativa a la de ScopePower)
carpeta = videos
; Rotacion de campo al apilar: automatico (se corrige salvo que la montura diga por ASCOM que es
; ecuatorial; si no lo dice, se corrige como altacimutal), siempre (se corrige aunque diga que es
; ecuatorial, p. ej. una altacimutal sobre cuna) o nunca. Tambien se cambia en el panel Video.
rotacion_campo = automatico

[Red]
; Punto de acceso de Windows en el mini PC para la tablet: la red la emite el propio mini PC
; (nombre y contrasena en Configuracion > Zona con cobertura inalambrica movil > Editar) y
; ScopePower queda siempre en http://192.168.137.1:5000. El wifi integrado sigue conectado a la
; vez al modulo del SynScan. ScopePower lo enciende al arrancar y lo vuelve a encender si se
; apaga (herramientas/punto_acceso.ps1). Solo en el mini PC de campo.
punto_acceso = false

[Sol]
; Numero de Wolf de las fotos del Sol (galeria, interruptor «Anotaciones»): R = k * (10*g + f), con g grupos
; y f manchas. k es el factor personal del observador: con un telescopio pequeno se ven menos manchas que
; en el indice de SILSO; para calibrarlo, compara durante unos dias tu R con el de SILSO del mismo dia y pon
; aqui el cociente medio (SILSO / tuyo). Con 1.0 se guarda el conteo tal cual.
factor_k = 1.0

[Disco]
; Aviso (cabecera de la app y voz del PC) cuando el disco de las fotos baja de este
; porcentaje libre. Con menos de la mitad, o de 2 GB, el aviso pasa a critico.
umbral_aviso_pct = 20

[Humor]
; Humor de la voz del PC, al estilo del robot TARS de Interstellar. Escondido de serie:
; se habilita con la casilla "Comentarios de a bordo" de Avisos por voz (Configuracion), y entonces
; aparece el boton "Humor" en la barra de la app para fijar el nivel (tocando o
; diciendoselo por el microfono). Nivel: 0 = serio, 100 = todas las frases, siempre;
; solo salen las frases de frases_humor.csv con nivel menor o igual, y con esa
; probabilidad por evento.
activado = false
nivel = 50

[Mosaico]
; Modo Mosaico del apilado (mosaico.py): una region mas grande que el campo de la camara se
; fotografia por teselas (filas x columnas de campos que se solapan), cada tesela se apila
; como siempre y al final se proyectan todas sobre el mismo plano del cielo (por su WCS, con
; la rotacion de campo de cada una) y se funden en una sola imagen, ya procesada. Se maneja
; desde el panel "Mosaico" de Apilado y desde el planetario (rejilla sobre el cielo).
; Rejilla por defecto y solape entre teselas vecinas (% del lado; 20 % aguanta unos 10
; grados de giro de campo entre teselas en una 2x2)
filas = 2
columnas = 2
solape_pct = 20
; Fotos apiladas por tesela (0 = las de numero_maximo_imagenes)
fotos_por_tesela = 0
; Lado mayor del mosaico en pixeles: por encima se reduce (memoria del mini PC)
lado_maximo = 4000
; Centrar por plate solving tras el GoTo de cada tesela (si falla, se apila donde apunte:
; el WCS de la tesela dice donde cayo de verdad)
centrar = true
; Minutos sin fotos aceptadas para dar la tesela por terminada con lo que tenga
minutos_sin_fotos = 10
; Guardar el mosaico en la galeria al terminar (<objeto>_<fecha>_mosaico)
guardar_galeria = true
; Anchura de la pluma de los bordes de cada tesela, en % de su lado (0 = la mitad del solape)
pluma_pct = 0

; Exposicion de cada foto en segundos; vacio = la de [Centrado] exposicion_centrado
exposicion =
; true = gira hacia el este (AR creciente); con montura alemana la app invierte el sentido si
; el giro cruzaria el meridiano
hacia_el_este = true
; Decir por voz la correccion cada vez que cambia (ademas de verla en pantalla)
voz = true
; vacio = el asentamiento_s general de [Montura]

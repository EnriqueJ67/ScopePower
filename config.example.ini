[PuestaEnEstacion]
; Asistente de puesta en estacion para monturas ecuatoriales (puesta_estacion.py), al estilo del
; plugin Three Point Polar Alignment de NINA: tres fotos resueltas con ASTAP girando solo el eje
; de AR miden el error del eje polar, y despues un bucle de fotos indica cuanto mover los
; tornillos de altura y acimut. Se abre desde Alineacion cuando la montura se declara ecuatorial.
; Grados que gira el eje de AR entre foto y foto (mas = mejor medida, mas recorrido)

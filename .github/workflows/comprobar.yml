# Comprobación automática en cada push y pull request. No hay montura ni cámara en
# GitHub, así que solo se comprueba lo que no necesita equipo: que todo compila, que
# no hay nombres sin definir y que las pruebas sintéticas de herramientas/ pasan.
name: Comprobar

on:
  push:
    branches: [master]
  pull_request:

jobs:
  comprobar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes babel

      - name: Compilar todos los módulos
        run: python -m compileall -q .

      - name: Nombres sin definir (pyflakes)
        shell: bash
        run: |
          # Solo los errores que rompen en ejecución; los "imported but unused" no bloquean.
          salida=$(python -m pyflakes *.py herramientas/*.py | grep -E "undefined name|invalid syntax" || true)
          if [ -n "$salida" ]; then echo "$salida"; exit 1; fi

      - name: Servidor web (importar ScopePower y pedir las pantallas, sin equipo)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_servidor.py

      - name: Traducciones (catálogo inglés completo y al día, marcadores, humor y datos _en)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_traducciones.py

      - name: Prueba del mosaico (cielo sintético, sin ASTAP)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_mosaico.py

      - name: Prueba del seguimiento de objetos (montura y cámara simuladas)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_seguimiento_simulado.py --segundos 10

      - name: Prueba del vídeo y el apilado de los mejores fotogramas (SER sintético, cámara falsa)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_apilado_video.py

      - name: Prueba del editor de día de la galería (galería de mentira en una carpeta temporal)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_editor_dia.py

      - name: Prueba de la Luna anotada (geometría contra JPL Horizons y Lunas sintéticas)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_luna_anotada.py

      - name: Prueba de la puesta en estación (montura falsa con error conocido, sin ASTAP)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_puesta_estacion.py

      - name: Prueba del guiado por el disco (corrección por ejes sobre una montura falsa)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_guiado_disco.py

      - name: Prueba del Número de Wolf (efemérides de Meeus, Sol sintético y galería de mentira)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_manchas_solares.py

      - name: Prueba de la fotometría del Sol (limbo por colores, temperatura, diámetro y órbita con Soles sintéticos)
        env:
          PYTHONIOENCODING: utf-8
        run: python herramientas/probar_fotometria_solar.py

<!-- templates/control.html -->
{% extends "base.html" %}

{% block title %}Control del Telescopio{% endblock %}

{% block content %}
<h2>Control del Telescopio</h2>

<!-- Vertical: velocidad y cruceta. Apaisado: cruceta a la izquierda y velocidad a la derecha.
     Aquí no va nada más: los botones de movimiento se tocan sin mirar y cualquier otro
     botón cerca acaba pulsado por error (el borrado de sincronizaciones está en Configuración) -->
<div class="control-layout">
    <div class="control-velocidad">
        <label for="speed">Velocidad:</label>
        <select id="speed">
            <option value="0.1">Lento</option>
            <option value="0.5">Medio</option>
            <option value="1.0">Rápido</option>
        </select>
    </div>

    <div class="control-cruceta">
        <div class="telescope-grid">
            <div></div>
            <button class="btn-dir up" ontouchstart="move('N')" ontouchend="stop()" onmousedown="move('N')" onmouseup="stop()"></button>
            <div></div>

            <button class="btn-dir left" ontouchstart="move('W')" ontouchend="stop()" onmousedown="move('W')" onmouseup="stop()"></button>
            <button class="btn-center" onclick="stop(); vibrar(40)">●</button>
            <button class="btn-dir right" ontouchstart="move('E')" ontouchend="stop()" onmousedown="move('E')" onmouseup="stop()"></button>

            <div></div>
            <button class="btn-dir down" ontouchstart="move('S')" ontouchend="stop()" onmousedown="move('S')" onmouseup="stop()"></button>
            <div></div>
        </div>
    </div>

</div>
<style>
    .control-layout {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas: "velocidad" "cruceta";
        gap: 12px 24px;
        align-items: center;
    }
    .control-velocidad { grid-area: velocidad; }
    .control-cruceta { grid-area: cruceta; }

    .telescope-grid {
        display: grid;
        grid-template-columns: repeat(3, auto);
        grid-template-rows: repeat(3, auto);
        gap: min(4vw, 24px);
        justify-content: center;
        align-items: center;
        justify-items: center;
        margin: 2vh auto 0 auto;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    /* Tamaño de los botones: grandes para el dedo, pero que quepan 3 en fila
       (24vw en móvil) y 3 en columna en pantallas bajas (20vh) */
    .btn-dir, .btn-center {
        width: min(120px, 24vw, 20vh);
        height: min(120px, 24vw, 20vh);
        background-color: #550000;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        position: relative;
        -webkit-tap-highlight-color: rgba(255,0,0,0.25);
    }
    .btn-dir:hover { background-color: #770000; }
    .btn-dir:active { background-color: #990000; }

    .btn-center {
        background-color: #330000;
        color: #ffaaaa;
        border-radius: 50%;
        font-size: 36px;
    }

    .btn-dir::before {
        content: "";
        display: inline-block;
        width: 0;
        height: 0;
        border: 28px solid transparent;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    .btn-dir.up::before { border-bottom-color: #ffcccc; }
    .btn-dir.down::before { border-top-color: #ffcccc; }
    .btn-dir.left::before { border-right-color: #ffcccc; }
    .btn-dir.right::before { border-left-color: #ffcccc; }

    select#speed {
        font-size: 18px;
        margin: 10px 0 10px;
        padding: 10px;
        border-radius: 8px;
        background-color: #220000;
        color: #ffcccc;
        border: 2px solid #770000;
    }

    /* Apaisado (tablet o móvil tumbado): cruceta a la izquierda, resto a la derecha */
    @media (min-width: 700px) and (orientation: landscape) {
        .control-layout {
            grid-template-columns: 1fr 1fr;
            grid-template-areas: "cruceta velocidad";
            align-items: center;
        }
        .telescope-grid { margin-top: 0; gap: 16px; }
        .btn-dir, .btn-center { width: min(130px, 14vw, 22vh); height: min(130px, 14vw, 22vh); }
    }

    /* Móvil tumbado: cabecera pequeña para que la cruceta entre sin scroll */
    @media (max-height: 500px) and (orientation: landscape) {
        body { padding-top: 8px; }
        h2 { font-size: 20px; margin: 4px 0 6px; }
        .telescope-grid { gap: 10px; }
        .btn-dir, .btn-center { width: min(120px, 24vw, 17vh); height: min(120px, 24vw, 17vh); }
        select#speed { margin: 4px 0; }
        .btn-dir::before { border-width: 18px; }
        .btn-center { font-size: 24px; }
    }
</style>

<script>
    const sonidoClick = new Audio("/static/click.wav");

    function vibrar(ms) {
        if (navigator.vibrate) {
            navigator.vibrate(ms);
        }
    }

    function move(direction) {
        let speed = document.getElementById('speed').value;
        fetch(`/move?dir=${direction}&speed=${speed}`, { method: 'GET' });
        sonidoClick.play();
        vibrar(50);
    }

    function stop() {
        fetch('/stop', { method: 'GET' });
        sonidoClick.play();
        vibrar(20);
    }
</script>
{% endblock %}

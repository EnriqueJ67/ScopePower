<!-- templates/control.html -->
{% extends "base.html" %}

{% block title %}{{ _("Control manual") }}{% endblock %}

{% block content %}
<!-- Vertical: velocidad, pad, flechas. Apaisado: pad a la izquierda y velocidad + flechas a la derecha.
     Aquí no va ningún otro botón: se maneja sin mirar y acabaría pulsado por error. -->
<div class="control-layout">
    {% include '_pad.html' %}

    <div class="control-flechas">
        <div class="telescope-grid">
            <div></div>
            <button class="btn-dir up" ontouchstart="move('N')" ontouchend="stop()" onmousedown="move('N')" onmouseup="stop()" aria-label="{{ _('Norte') }}"></button>
            <div></div>

            <button class="btn-dir left" ontouchstart="move('W')" ontouchend="stop()" onmousedown="move('W')" onmouseup="stop()" aria-label="{{ _('Oeste') }}"></button>
            <button class="btn-center" onclick="stop(); vibrar(40)" aria-label="{{ _('Parar') }}"><svg><use href="#i-stop"/></svg></button>
            <button class="btn-dir right" ontouchstart="move('E')" ontouchend="stop()" onmousedown="move('E')" onmouseup="stop()" aria-label="{{ _('Este') }}"></button>

            <div></div>
            <button class="btn-dir down" ontouchstart="move('S')" ontouchend="stop()" onmousedown="move('S')" onmouseup="stop()" aria-label="{{ _('Sur') }}"></button>
            <div></div>
        </div>
    </div>
</div>

<style>
    .control-layout {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas: "velocidad" "pad" "flechas";
        gap: 14px 24px;
        align-items: center;
        justify-items: center;
    }
    .control-velocidad { grid-area: velocidad; }
    .control-pad { grid-area: pad; }
    .control-flechas { grid-area: flechas; margin-top: 4px; }

    /* ── Flechas (secundarias, más pequeñas) ── */
    .telescope-grid {
        display: grid;
        grid-template-columns: repeat(3, auto);
        grid-template-rows: repeat(3, auto);
        gap: 8px;
        justify-content: center; align-items: center; justify-items: center;
        margin: 0 auto;
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none;
    }
    .btn-dir, .btn-center {
        width: min(68px, 17vw, 11vh); height: min(68px, 17vw, 11vh);
        background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 16px; cursor: pointer; position: relative;
        -webkit-tap-highlight-color: transparent; color: var(--text);
        transition: background .1s, transform .08s;
    }
    .btn-dir:hover { background: var(--surface-3); }
    .btn-dir:active { background: var(--accent); border-color: transparent; transform: scale(0.96); }
    .btn-center { background: var(--bg-2); border-radius: 50%; display: grid; place-items: center; color: var(--err); }
    .btn-center svg { width: 40%; height: 40%; }
    .btn-center:active { background: var(--err-soft); }
    .btn-dir::before {
        content: ""; display: inline-block; width: 0; height: 0; border: 13px solid transparent;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .btn-dir.up::before { border-bottom-color: var(--text); transform: translate(-50%, -70%); }
    .btn-dir.down::before { border-top-color: var(--text); transform: translate(-50%, -30%); }
    .btn-dir.left::before { border-right-color: var(--text); transform: translate(-70%, -50%); }
    .btn-dir.right::before { border-left-color: var(--text); transform: translate(-30%, -50%); }

    /* Apaisado: pad a la izquierda; velocidad y flechas a la derecha */
    @media (min-width: 700px) and (orientation: landscape) {
        .control-layout {
            grid-template-columns: 1fr 1fr;
            grid-template-areas: "pad velocidad" "pad flechas";
            align-items: center;
        }
        .pad { width: min(44vw, 74vh, 460px); height: min(44vw, 74vh, 460px); }
        .control-velocidad { align-self: end; }
        .control-flechas { align-self: start; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
        .pad { width: min(44vw, 66vh, 300px); height: min(44vw, 66vh, 300px); }
        .btn-dir, .btn-center { width: min(52px, 13vw, 11vh); height: min(52px, 13vw, 11vh); }
        .btn-dir::before { border-width: 10px; }
        .control-layout { gap: 8px 16px; }
    }
</style>

<script>
    // El pad, la velocidad y vibrar() están en static/js/pad.js (cargado por _pad.html)
    const sonidoClick = new Audio("/static/click.wav");

    // ── Flechas (como siempre: velocidad fija mientras se mantiene pulsado) ──
    function move(direction) {
        let speed = document.getElementById('speed').value;
        fetch(`/move?dir=${direction}&speed=${speed}`, { method: 'GET' });
        sonidoClick.play();
        vibrar(50);
    }

    function stop() {
        fetch('/stop', { method: 'GET' });
        sonidoClick.play();
        vibrar(20);
    }
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}GOTO Objeto Celeste{% endblock %}

{% block content %}
<h2>GOTO Objeto Celeste</h2>

<div id="config" data-palabra-clave="{{ palabra_clave }}"></div>

<div id="estado_stellarium" style="margin-bottom: 10px; font-size: 0.9em; color: gray;">
    Verificando estado de Stellarium...
</div>

<form id="gotoForm">
    <label for="objeto">Nombre del Objeto:</label>
    <input type="text" id="objeto" name="objeto" required>

    <button type="button" onclick="startSpeechRecognition()">🎙️ Voz-GOTO</button>
    <button type="button" onclick="toggleContinuousRecognition()">🎙️ Voz cont.-GOTO</button>
    <button type="button" onclick="sendGotoRequest()">🔭 GOTO</button>
    <button id="btnModoAutomatico" type="button" onclick="lanzarModoAutomatico()" disabled>🎯 Centrado Automático</button>

</form>

<p id="status"></p>
<div id="extraInfo" style="margin-top: 30px; font-size: 18px;"></div>

<style>
    #gotoForm {
        width: 100%;
        max-width: 500px;
        margin: auto;
        padding: 10px;
        box-sizing: border-box;
    }

    #gotoForm label {
        display: block;
        margin-bottom: 10px;
        font-size: 32px;
        font-weight: bold;
    }

    #gotoForm input[type="text"] {
        width: 100%;
        padding: 20px;
        font-size: 32px;
        margin-bottom: 25px;
        border: 2px solid #770000;
        border-radius: 10px;
        background-color: #220000;
        color: #ffcccc;
        box-sizing: border-box;
    }

    #gotoForm button {
        display: block;
        width: 100%;
        margin: 15px 0;
        padding: 24px;
        font-size: 32px;
        background-color: #550000;
        color: #ffcccc;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    #gotoForm button:hover {
        background-color: #770000;
    }

    #status {
        font-size: 24px;
        margin-top: 20px;
    }

    .spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 4px solid #ccc;
        border-top: 4px solid #ffcccc;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
        vertical-align: middle;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 1024px), (max-height: 720px) {
        #gotoForm label {
            font-size: 48px;
        }

        #gotoForm input[type="text"] {
            font-size: 48px;
            padding: 28px;
        }

        #gotoForm button {
            font-size: 48px;
            padding: 36px;
            border-radius: 18px;
        }

        #status {
            font-size: 40px;
        }
    }
</style>

<script>
    const palabraClave = document.getElementById("config").dataset.palabraClave.toLowerCase();
    const sonidoClick = new Audio("/static/click.wav");

    let recognition;
    let recognizing = false;
    let recognitionRunning = false;

    function startSpeechRecognition() {
        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-ES';
        recognition.start();

        recognition.onresult = function (event) {
            var texto = event.results[0][0].transcript.trim();
            texto = texto.replace(/[¿?.,!¡;-]/g, ""); // Aquí también
            texto = texto.normalize("NFD").replace(/[̀-ͯ]/g, "");
            document.getElementById('objeto').value = texto;

            setTimeout(function () {
                sendGotoRequest();
            }, 500);
        };
    }

    function toggleContinuousRecognition() {
        if (recognizing) {
            recognition.stop();
            recognizing = false;
            document.getElementById('status').innerHTML = "🛑 Auto-GOTO desactivado.";
            return;
        }

        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognizing = true;

        document.getElementById('status').innerHTML = "🎙️ Auto-GOTO activado. Hable para mover el telescopio.";

        recognition.onstart = () => recognitionRunning = true;
        recognition.onend = () => {
            recognitionRunning = false;
            if (recognizing) {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (err) {
                        console.warn("No se pudo reiniciar el reconocimiento:", err);
                    }
                }, 500);
            }
        };

        recognition.onresult = function (event) {
            const results = event.results;


            var texto = event.results[event.results.length - 1][0].transcript.trim();
            texto = texto.toLowerCase(); // 👈 Convierte todo a minúsculas
            texto = texto.replace(/[¿?.,!¡;-]/g, ""); // 🧼 Elimina signos de puntuación
            texto = texto.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // Elimina acentos

            console.log("Voz detectada:", texto);

            if (texto.startsWith(palabraClave + " ")) {
                texto = texto.substring(palabraClave.length).trim();
                document.getElementById('objeto').value = texto;
                sonidoClick.play();
                sendGotoRequest();
            } else {
                document.getElementById('status').innerHTML = `⚠️ Debe decir "<b>${palabraClave}</b>" antes del objeto.`;
            }
        };

        recognition.onerror = function (event) {
            console.warn("Error de reconocimiento:", event.error);

            if ((event.error === 'no-speech' || event.error === 'network') && recognizing && !recognitionRunning) {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.warn("Recognition ya en marcha.");
                    }
                }, 500);
            }
        };

        try {
            recognition.start();
            sonidoClick.play();
        } catch (err) {
            console.warn("Error al iniciar reconocimiento:", err);
        }
    }


    function getIconForType(type) {
        if (!type) return "❓";
        const icons = {
            "star": "⭐",
            "planet": "🪐",
            "galaxy": "🌌",
            "nebula": "☁️",
            "asteroid": "🪨",
            "comet": "☄️",
            "moon": "🌕",
            "constellation": "✨",
            "cluster": "🔘",
            "double star": "🌟🌟"
        };
        return icons[type.toLowerCase()] || "🔭";
    }

    function esperarFinDeMovimiento(objeto) {
        const interval = setInterval(() => {
            fetch("/estado_telescopio")
                .then(response => response.json())
                .then(data => {
                    if (!data.slewing) {
                        clearInterval(interval);
                        document.getElementById("status").innerHTML = `🧭 Telescopio en <b>${objeto}</b>`;
                        document.getElementById("btnModoAutomatico").disabled = false;
                    }
                })
                .catch(err => {
                    clearInterval(interval);
                    console.error("Error al comprobar estado del telescopio", err);
                });
        }, 1000);
    }

    function lanzarModoAutomatico() {
        document.getElementById("status").innerHTML = `<span class="spinner"></span> Ejecutando Centrado automático...`;
        document.getElementById("btnModoAutomatico").disabled = true;

        fetch("/modo-automatico")
            .then(response => response.text())
            .then(html => {
                document.getElementById("status").innerHTML = html;
            })
            .catch(err => {
                document.getElementById("status").innerHTML = "❌ Error al ejecutar modo automático: " + err;
            });
    }


    function sendGotoRequest() {
        const objeto = document.getElementById("objeto").value.trim();
        if (!objeto) {
            document.getElementById("status").innerHTML = "❌ Debe ingresar un objeto celeste.";
            return;
        }

        document.getElementById("status").innerHTML = `<span class="spinner"></span> Obteniendo datos de <b>${objeto}</b>...`;
        document.getElementById("extraInfo").innerHTML = "";
        document.getElementById("btnModoAutomatico").disabled = true;

        fetch("/goto", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "objeto=" + encodeURIComponent(objeto)
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById("status").innerHTML = "❌ " + data.error;
            } else if (data.warning) {
                document.getElementById("status").innerHTML = "⚠️ " + data.warning;
            } else if (data.message) {
                document.getElementById("status").innerHTML = data.message;
                esperarFinDeMovimiento(objeto);
            } else {
                document.getElementById("status").innerHTML = "❌ Respuesta inesperada del servidor.";
            }

            if (data.extra_info) {
                const info = data.extra_info;
                const icono = getIconForType(info.type);
                let html = `<h3>${icono} Información del objeto</h3><ul>`;
                if (info.name) html += `<li><b>Nombre:</b> ${info.name}</li>`;
                if (info.type) html += `<li><b>Tipo:</b> ${info.type}</li>`;
                if (info.constellation || info.iauConstellation) html += `<li><b>Constelación:</b> ${info.constellation || info.iauConstellation}</li>`;
                const mag = info.mag ?? info.vmag ?? info.vmage;
                if (mag !== undefined && mag !== null) {
                    html += `<li><b>Magnitud aparente:</b> ${mag.toFixed(2)}</li>`;
                } else {
                    html += `<li><b>Magnitud aparente:</b> No disponible</li>`;
                }
                if (info.alt) html += `<li><b>Altitud:</b> ${info.alt.toFixed(2)}°</li>`;
                if (info.az) html += `<li><b>Azimut:</b> ${info.az.toFixed(2)}°</li>`;
                if (info.distance) html += `<li><b>Distancia:</b> ${info.distance.toFixed(2)}</li>`;
                if (info.phase !== null) html += `<li><b>Fase:</b> ${(info.phase * 100).toFixed(1)}%</li>`;
                if (info.illumination !== null) html += `<li><b>Iluminación:</b> ${(info.illumination * 100).toFixed(1)}%</li>`;
                html += "</ul>";
                document.getElementById("extraInfo").innerHTML = html;
            }
        })
        .catch(error => {
            document.getElementById("status").innerHTML = "❌ Error en la solicitud: " + error;
        });
    }

    function actualizarEstadoStellarium() {
        fetch("/estado_stellarium")
            .then(response => response.json())
            .then(data => {
                const div = document.getElementById("estado_stellarium");
                if (data.disponible) {
                    div.innerHTML = "🟢 <b>Stellarium disponible</b>";
                    div.style.color = "green";
                } else {
                    div.innerHTML = "🔴 <b>Stellarium no detectado</b>";
                    div.style.color = "red";
                }
            })
            .catch(error => {
                document.getElementById("estado_stellarium").innerHTML = "⚠️ Error al verificar Stellarium";
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        actualizarEstadoStellarium();
        setInterval(actualizarEstadoStellarium, 10000);
    });
</script>
{% endblock %}

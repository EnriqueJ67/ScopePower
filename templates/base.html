<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ url_for('static', filename='scopepower.ico') }}" type="image/x-icon">
    <title>{% block title %}Telescopio{% endblock %}</title>
    <style>
        body {
            background-color: #330000;
            color: #ffcccc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        a {
            color: #ff9999;
            font-weight: bold;
        }

        button, select, input {
            font-size: 16px;
            margin: 5px 0;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    <!-- VOLVER AL INICIO -->
    {% if mostrar_volver %}
    <div style="margin-bottom: 20px;">
        <a href='/' style="display: inline-block; margin-top: 20px; font-size: 18px;">⬅️ Volver a la pantalla principal</a>
    </div>
    {% endif %}

</body>
</html>

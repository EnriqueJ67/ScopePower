<!-- templates/imagen.html -->
{% extends "base.html" %}

{% block title %}Foto de prueba{% endblock %}

{% block content %}
<div class="pagina-cabecera">
    <div>
        <h1 class="pagina-titulo">Foto de prueba</h1>
        <p class="pagina-sub">Para enfocar y comprobar el encuadre. Usa la exposición de Configuración y resta el dark si lo hay.</p>
    </div>
</div>

<!-- En pantalla ancha: foto a la izquierda, botones y ajustes a la derecha -->
<div class="grid-2 ancha foto-layout">
    <div class="foto-imagen">
        <div class="visor">
            <img id="foto" src="{{ url_for('imagen_capturada') }}?{{ range(1, 100000) | random }}" alt="Última foto">
            <div class="visor-pie" id="barra-bloque" style="display: none;">
                <div id="estado-foto-pie"></div>
                <div class="progress"><div id="barra" class="progress-bar ok"></div></div>
            </div>
        </div>
    </div>

    <div class="foto-controles">
        <div class="card">
            <div class="acciones-grid">
                <button id="btn-foto" class="btn btn-primary btn-lg" onclick="hacerFoto()"><svg><use href="#i-foto"/></svg>Hacer foto</button>
                <button id="btn-cancelar" class="btn btn-secondary" onclick="cancelar()" style="display: none;"><svg><use href="#i-stop"/></svg>Cancelar</button>
                <button id="btn-sync" class="btn btn-secondary" onclick="sincronizar()" disabled title="Se activa cuando hay una foto nueva"><svg><use href="#i-sync"/></svg>Sincronizar telescopio con la foto</button>
            </div>
            <div id="estado-foto" class="estado mt-2"></div>
            <div id="estado-sync" class="estado"></div>
        </div>

        <div class="card">
            <div class="card-header"><h3 class="card-title"><svg class="ico"><use href="#i-ajustes"/></svg>Vista previa</h3></div>
            <div class="campo">
                <label for="input-color">Intensidad del color</label>
                <input type="number" id="input-color" class="form-control" min="0" max="3" step="0.1">
            </div>
            <div class="fila entre">
                <button class="btn btn-secondary" onclick="guardarParametrosMTF()"><svg><use href="#i-guardar"/></svg>Guardar</button>
                <div id="estado-mtf" class="estado"></div>
            </div>
        </div>

        <a href="{{ url_for('vista_calibracion') }}" class="btn btn-ghost btn-block"><svg><use href="#i-calibracion"/></svg>Calibración: darks y flats</a>
    </div>
</div>

<style>
    .foto-controles { display: flex; flex-direction: column; gap: 12px; }
    .foto-controles .card + .card { margin-top: 0; }
    @media (min-width: 760px) { .foto-imagen { position: sticky; top: calc(var(--header-h) + 10px); } }
    @media (max-height: 500px) and (orientation: landscape) {
        .foto-layout { grid-template-columns: minmax(0, 1fr) minmax(260px, 1fr); }
        .foto-imagen img { max-height: calc(100vh - 90px); width: auto; max-width: 100%; margin: 0 auto; }
    }
</style>

<script>
    let sondeo = null;
    let hayFotoNueva = false;

    function pintarProgreso(c) {
        const bloque = document.getElementById("barra-bloque");
        if (c && c.en_curso) {
            const hechos = Math.max(0, c.exposicion - c.restante);
            document.getElementById("barra").style.width = (c.exposicion > 0 ? 100 * hechos / c.exposicion : 0) + "%";
            document.getElementById("estado-foto-pie").textContent = `Exponiendo · ${Math.ceil(hechos)} / ${c.exposicion} s`;
            document.getElementById("estado-foto").textContent = `Exponiendo · ${Math.ceil(hechos)} / ${c.exposicion} s`;
            bloque.style.display = "block";
        } else {
            bloque.style.display = "none";
        }
    }

    function sondearCaptura() {
        fetch("/estado-captura").then(r => r.json()).then(pintarProgreso).catch(() => {});
    }

    function hacerFoto() {
        const btn = document.getElementById("btn-foto");
        btn.disabled = true;
        document.getElementById("btn-cancelar").style.display = "inline-flex";
        document.getElementById("estado-foto").innerHTML = '<span class="spinner"></span>Preparando la cámara...';
        document.getElementById("estado-sync").textContent = "";
        if (!sondeo) sondeo = setInterval(sondearCaptura, 1000);
        fetch("/capturar-imagen?apilar=0&json=1")
            .then(r => r.json())
            .then(d => {
                clearInterval(sondeo); sondeo = null; pintarProgreso(null);
                const est = document.getElementById("estado-foto");
                if (d.ok) {
                    est.className = "estado ok mt-2";
                    est.textContent = "✅ " + d.mensaje + (d.dark ? " (dark restado)" : "");
                    document.getElementById("foto").src = "/imagen-capturada?" + Date.now();
                    hayFotoNueva = true;
                    document.getElementById("btn-sync").disabled = false;
                } else {
                    est.className = "estado err mt-2";
                    est.textContent = "❌ " + (d.mensaje || "Error al capturar");
                }
            })
            .catch(err => { clearInterval(sondeo); sondeo = null; document.getElementById("estado-foto").textContent = "❌ " + err; })
            .finally(() => { btn.disabled = false; document.getElementById("btn-cancelar").style.display = "none"; });
    }

    function cancelar() {
        fetch("/cancelar-captura", { method: "POST" }).catch(() => {});
    }

    function sincronizar() {
        const btn = document.getElementById("btn-sync");
        btn.disabled = true;
        const est = document.getElementById("estado-sync");
        est.className = "estado";
        est.innerHTML = '<span class="spinner"></span>Resolviendo la foto con ASTAP y sincronizando...';
        fetch("/sincronizar-foto", { method: "POST" })
            .then(r => r.json())
            .then(d => {
                est.className = "estado " + (d.ok ? "ok" : "err");
                est.textContent = (d.ok ? "✅ " : "❌ ") + d.mensaje;
            })
            .catch(err => { est.className = "estado err"; est.textContent = "❌ " + err; })
            .finally(() => { btn.disabled = !hayFotoNueva; });
    }

    function cargarParametros() {
        fetch("/config-color").then(r => r.json()).then(d => {
            document.getElementById("input-color").value = d.intensidad;
        }).catch(err => document.getElementById("estado-mtf").textContent = "❌ Error al cargar intensidad de color");
    }

    function guardarParametrosMTF() {
        const intensidad = parseFloat(document.getElementById("input-color").value);
        fetch("/guardar-config-color", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ intensidad })
        }).then(r => r.text()).then(msg => document.getElementById("estado-mtf").textContent = msg);
    }

    cargarParametros();
    // Si ya hay una exposición en marcha (p. ej. desde otra pestaña), mostrarla
    fetch("/estado-captura").then(r => r.json()).then(c => { if (c.en_curso && !sondeo) sondeo = setInterval(sondearCaptura, 1000); }).catch(() => {});
</script>
{% endblock %}

<!-- templates/esta_noche.html -->
{% extends "base.html" %}

{% block title %}{{ _("Esta noche") }}{% endblock %}

{% block content %}
<div class="pagina-cabecera">
    <div>
        <h1 class="pagina-titulo">{{ _("Esta noche") }}</h1>
        <p class="pagina-sub" id="resumen"><span class="spinner"></span>{{ _("Calculando qué se ve bien hoy...") }}</p>
    </div>
</div>

<div class="card card-plana filtros">
    <select id="filtro-tipo" onchange="pintar()">
        <option value="">{{ _("Todos los tipos") }}</option>
        <option value="Galaxia">{{ _("Galaxias") }}</option>
        <option value="Nebulosa">{{ _("Nebulosas") }}</option>
        <option value="Nebulosa planetaria">{{ _("Nebulosas planetarias") }}</option>
        <option value="Cúmulo abierto">{{ _("Cúmulos abiertos") }}</option>
        <option value="Cúmulo globular">{{ _("Cúmulos globulares") }}</option>
        <option value="Resto de supernova">{{ _("Restos de supernova") }}</option>
        <option value="Planeta">{{ _("Planetas y Luna") }}</option>
        <option value="Cometa">{{ _("Cometas y asteroides") }}</option>
    </select>
    <select id="orden" onchange="pintar()">
        <option value="puntuacion">{{ _("Recomendados") }}</option>
        <option value="alt_ahora">{{ _("Más altos ahora") }}</option>
        <option value="alt_max">{{ _("Más altos esta noche") }}</option>
    </select>
    <label class="switch"><input type="checkbox" id="solo-ahora" onchange="pintar()"> {{ _("Solo visibles ahora") }}</label>
</div>

<div id="tarjetas" class="tarjetas mt-2"></div>
<div id="vacio" class="card centro texto-2 mt-2" hidden>{{ _("Nada cumple el filtro. Prueba con otro tipo o quita «solo visibles ahora».") }}</div>

<style>
    .filtros { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: center; padding: 12px; }
    @media (min-width: 620px) { .filtros { grid-template-columns: 1fr 1fr auto; } }

    .tarjetas { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 700px) { .tarjetas { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1000px) and (orientation: landscape) { .tarjetas { grid-template-columns: 1fr 1fr 1fr; } }

    .tarjeta { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-wrap: anywhere; box-shadow: var(--shadow-sm); }
    .tarjeta.ahora { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
    .tarjeta.mas-tarde { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
    .tarjeta.no { opacity: 0.55; }
    .tarjeta .cabecera { display: flex; align-items: flex-start; gap: 10px; }
    .tarjeta .icono { font-size: 22px; line-height: 1; padding-top: 2px; }
    .tarjeta .nombre { font-size: 18px; font-weight: 700; line-height: 1.2; }
    .tarjeta .id { font-size: 13px; color: var(--text-3); }
    .tarjeta .datos { font-size: 13px; color: var(--text-2); }
    .tarjeta .desc { font-size: 14px; color: var(--text-2); }
    .tarjeta .visib { font-size: 13.5px; font-weight: 600; }
    .tarjeta .visib.ok { color: var(--ok); }
    .tarjeta .visib.tarde { color: var(--warn); }
    .tarjeta .visib.no { color: var(--text-3); }
    .tarjeta .estrellas { color: var(--warn); letter-spacing: 1px; font-size: 12px; }
    .tarjeta .btn { margin-top: 6px; }
    .tarjeta .acciones { gap: 6px; }
</style>
<script src="{{ url_for('static', filename='js/plan.js') }}"></script>

<script>
    let datos = null;
    const iconos = { "Galaxia": "🌌", "Nebulosa": "☁️", "Nebulosa planetaria": "💍", "Cúmulo abierto": "✨", "Cúmulo globular": "🔮",
                     "Resto de supernova": "💥", "Planeta": "🪐", "Luna": "🌙", "Nebulosa oscura": "🐴", "Cometa": "☄️", "Asteroide": "🪨" };

    function cargar() {
        fetch("/esta-noche/objetos").then(r => r.json()).then(d => {
            datos = d;
            const nObjetos = ngettext("{n} objeto", "{n} objetos", d.objetos.length);
            document.getElementById("resumen").textContent =
                _("Noche de {desde} a {hasta} · altura mínima {altura}° · {objetos} · calculado a las {hora}",
                  { desde: d.noche_desde, hasta: d.noche_hasta, altura: fmtNum(d.altura_minima), objetos: nObjetos, hora: d.calculado });
            pintar();
        }).catch(err => document.getElementById("resumen").textContent = "❌ " + err);
    }

    function pintar() {
        if (!datos) return;
        const tipo = document.getElementById("filtro-tipo").value;
        const soloAhora = document.getElementById("solo-ahora").checked;
        const orden = document.getElementById("orden").value;
        let lista = datos.objetos.filter(o => !tipo || o.tipo === tipo || (tipo === "Planeta" && o.tipo === "Luna") || (tipo === "Cometa" && o.tipo === "Asteroide"));
        if (soloAhora) lista = lista.filter(o => o.visible_ahora);
        lista.sort((a, b) => b[orden] - a[orden] || b.puntuacion - a.puntuacion);
        const cont = document.getElementById("tarjetas");
        cont.innerHTML = "";
        document.getElementById("vacio").hidden = lista.length > 0;
        for (const o of lista) {
            let clase, visib, texto;
            if (o.visible_ahora) { clase = "ahora"; visib = "ok"; texto = _("Ahora a {alt}° · máximo {max}° a las {hora}", { alt: fmtNum(o.alt_ahora), max: fmtNum(o.alt_max), hora: o.hora_max }); }
            else if (o.visible_desde) { clase = "mas-tarde"; visib = "tarde"; texto = _("Visible de {desde} a {hasta} · máximo {max}° a las {hora}", { desde: o.visible_desde, hasta: o.visible_hasta, max: fmtNum(o.alt_max), hora: o.hora_max }); }
            else { clase = "no"; visib = "no"; texto = _("Esta noche no sube de {max}°", { max: fmtNum(o.alt_max) }); }
            const datosTxt = [o.tipo ? _(o.tipo) : "", o.constelacion, o.mag !== null ? _("mag {mag}", { mag: fmtNum(o.mag) }) : "", o.tamano_arcmin ? `${fmtNum(o.tamano_arcmin)}′` : ""].filter(Boolean).join(" · ");
            const esCuerpo = o.tipo === "Planeta" || o.tipo === "Luna";
            const nombre = esCuerpo ? _(o.nombre) : o.nombre;      // Luna, Júpiter... van en español (clave del GoTo)
            const div = document.createElement("div");
            div.className = "tarjeta " + clase;
            div.innerHTML = `
                <div class="cabecera"><span class="icono">${iconos[o.tipo] || "🔭"}</span>
                    <div><div class="nombre">${nombre}</div><div class="id">${o.id !== o.nombre ? o.id : ""}${o.nombre_alt && o.nombre_alt !== o.id ? " · " + o.nombre_alt : ""}</div></div></div>
                <div class="datos">${datosTxt} <span class="estrellas">${"★".repeat(o.popularidad)}${"☆".repeat(5 - o.popularidad)}</span></div>
                <div class="desc">${o.descripcion}</div>
                <div class="visib ${visib}">${texto}</div>
                <div class="acciones">
                    <a class="btn ${o.visible_ahora ? "btn-primary" : "btn-secondary"}" href="/goto?objeto=${encodeURIComponent(o.nombre)}&ra=${o.ra_h}&dec=${o.dec_deg}"><svg><use href="#i-goto"/></svg>` + _("Ir y centrar") + `</a>
                    <button type="button" class="btn btn-ghost" title="` + _("Añadir a la lista del plan de la noche (pantalla Apilado)") + `"><svg><use href="#i-apilado"/></svg>` + _("Añadir al plan") + `</button>
                </div>`;
            const botonPlan = div.querySelector("button");
            botonPlan.onclick = () => anadirAlPlan(esCuerpo ? { nombre: o.nombre, tipo: o.tipo } : { nombre: o.nombre, ra: o.ra_h, dec: o.dec_deg, tipo: o.tipo }, botonPlan);
            cont.appendChild(div);
        }
    }

    cargar();
    setInterval(cargar, 5 * 60 * 1000);   // la altura "ahora" cambia; refrescar cada 5 min
</script>
{% endblock %}

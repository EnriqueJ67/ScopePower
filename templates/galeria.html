{% extends "base.html" %}

{% block content %}
<h2 style="text-align: center; color: #ffaa88;">📷 Galería de Imágenes Astronómicas</h2>

<div style="text-align: center; margin: 20px;">
    <label for="orden" style="color: #ffcccc;">Ordenar por:</label>
    <select id="orden" onchange="ordenarGaleria()" style="background: #330000; color: #ffcccc; padding: 6px; border-radius: 5px;">
        <option value="objeto">🪐 Objeto</option>
        <option value="fecha">📅 Fecha</option>
    </select>
</div>

<div id="galeria" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 10px;">
    {% for nombre in imagenes %}
    <div class="tarjeta" data-objeto="{{ nombre.split('_')[0] }}" data-fecha="{{ nombre.split('_')[1] }}" style="position: relative;">
        <img src="{{ url_for('static', filename='fotos/' ~ nombre) }}" alt="{{ nombre }}" onclick="abrirLightbox(this.src)" style="width: 250px; max-width: 100%; border: 3px solid #770000; border-radius: 10px; cursor: zoom-in;">

        <!-- Nombre debajo -->
        <div style="color: #ffaaaa; margin-top: 5px;">{{ nombre.replace('.jpg','') }}</div>

        <!-- Botón flotante tipo X -->
        <button onclick="eliminarImagen('{{ nombre }}')"
                style="position: absolute; top: 5px; right: 5px; background: rgba(150,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; font-weight: bold; cursor: pointer;"
                title="Eliminar imagen">
            ×
        </button>
    </div>
    {% endfor %}
</div>

<!-- Lightbox flotante -->
<div id="lightbox" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(20, 0, 0, 0.95);
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
    box-sizing: border-box;">

    <img id="imagen-grande" src="" style="
        width: auto;
        height: auto;
        max-width: 95vw;
        max-height: 95vh;
        border: 5px solid #aa0000;
        border-radius: 10px;
        box-shadow: 0 0 30px #aa0000;
        object-fit: contain;">
</div>



<script>
    function abrirLightbox(src) {
        const lightbox = document.getElementById('lightbox');
        const imagen = document.getElementById('imagen-grande');
        imagen.src = src;
        lightbox.style.display = "flex";
    }

    document.getElementById('lightbox').onclick = () => {
        document.getElementById('lightbox').style.display = "none";
    };

    function ordenarGaleria() {
        const criterio = document.getElementById("orden").value;
        const galeria = document.getElementById("galeria");
        const tarjetas = Array.from(galeria.children);

        tarjetas.sort((a, b) => {
            let valA = a.dataset[criterio].toLowerCase();
            let valB = b.dataset[criterio].toLowerCase();
            return valA.localeCompare(valB);
        });

        tarjetas.forEach(t => galeria.appendChild(t));
    }
    function eliminarImagen(nombre) {
        if (!confirm("¿Seguro que quieres eliminar esta imagen?")) return;

        fetch("/eliminar-imagen", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre })
        })
            .then(res => res.json())
            .then(data => {
                alert(data.mensaje || data.error);
                if (data.ok) {
                    const tarjeta = document.querySelector(`.tarjeta button[onclick*="'${nombre}'"]`).parentElement;
                    tarjeta.remove();
                }

            });
    }

</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Recorrido por Constelación{% endblock %}

{% block content %}
<h2>🔭 Recorrido por Constelación</h2>

<!-- ————— Paso 1: Selector de recorridos ————— -->
<div id="recorrido-header" style="text-align:center; margin-bottom:20px;">
    <select id="listaRecorridos">
        <option value="">-- SELECCIONA --</option>
    </select>
    <button type="button" id="btnIniciarRecorrido" disabled>▶️ Iniciar recorrido</button>
</div>

<form id="formConstelacion">
    <label for="nombre_constelacion">Nombre de la constelación:</label>
    <input type="text" id="nombre_constelacion" name="nombre_constelacion" required>

    <button type="button" onclick="reconocimientoVoz()">🎙️ Escuchar</button>
    <button type="button" onclick="iniciarRecorrido()">▶️ Preparar recorrido</button>
</form>

<p id="status" style="font-size: 24px; margin-top: 20px;"></p>
<div id="etiquetaEstrella" style="font-size: 36px; color: yellow; margin-top: 40px;"></div>
<div id="infoEstrellaExtra" style="margin-top: 10px; font-size: 20px; color: #ffcccc;"></div>

<ul id="listaEstrellas" style="margin-top: 30px; font-size: 20px; line-height: 1.6;"></ul>

<div style="text-align: center; margin-top: 30px;">
    <button id="btnControlAudio" style="display: none;" onclick="toggleAudio()">⏸️ Pausar</button>
</div>

<style>

    /* Estilo para ítems saltados */
    .estrella-skip {
        color: #666;
        opacity: 0.6;
        text-decoration: line-through;
    }
    .estrella-activa {
        background-color: #440000;
        font-weight: bold;
        color: #ffdddd;
        border-left: 5px solid #ffcccc;
        padding-left: 10px;
    }

    #formConstelacion {
        max-width: 500px;
        margin: auto;
        padding: 10px;
        box-sizing: border-box;
    }

        #formConstelacion label {
            display: block;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: bold;
        }

        #formConstelacion input[type="text"] {
            width: 100%;
            padding: 20px;
            font-size: 32px;
            margin-bottom: 25px;
            border: 2px solid #770000;
            border-radius: 10px;
            background-color: #220000;
            color: #ffcccc;
        }

    #btnControlAudio {
        display: inline-block; /* Para que ocupe sólo lo que necesite */
        width: auto; /* Elimina el ancho 100% */
        margin: 15px 0;
        padding: 24px 32px; /* Ajusta el padding horizontal si quieres más anchura */
        font-size: 32px;
        background-color: #550000;
        color: #ffcccc;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    #formConstelacion button {
        display: block;
        width: 100%;
        margin: 15px 0;
        padding: 24px;
        font-size: 32px;
        background-color: #550000;
        color: #ffcccc;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
    }

        /* Hover para ambos botones */
        #formConstelacion button:hover,
        #btnControlAudio:hover {
            background-color: #770000;
        }
</style>

    };

    // Mapeo tipo → icono
    const iconByTipo = {
        'Estrella': '⭐',
        'Neb': '🌌',
        'HII': '🌌',
        'Sy2': '🌌',
        'G': '🌀',
        'OC': '🌠',
        'GC': '🔵',
        'PN': '💫',
        'RNe': '💫',
        'Lin': '🌌',
        'LIN': '🌌',
        'AGN': '🌌',
        'GiG': '🌌',
        'GiP': '🌌',
        'GlC': '🔵',
        'SNR': '🌀',
        'default': '🔭'
    };

    // Texto para voz por tipo
    const tipoVoz = {
        'Estrella': 'Estrella',
        'Neb': 'Nebulosa',
        'HII': 'Nebulosa',
        'G': 'Galaxia',
        'Sy2': 'Galaxia',
        'Lin': 'Galaxia',
        'LIN': 'Galaxia',
        'AGN': 'Galaxia',
        'GiG': 'Galaxia',
        'GiP': 'Galaxia',
        'PN': 'Nebulosa planetaria',
        'OC': 'Cúmulo abierto',
        'GC': 'Cúmulo globular',
        'GlC': 'Cúmulo globular',
        'RNe': 'Nebulosa de reflexión',
        'SNR': 'Remanente de supernova',
        'default': 'Objeto'
    };

    // Resetea estado para cada nuevo recorrido
    function resetRecorrido() {
        listaEstrellas = [];
        indiceActual = 0;
        document.getElementById("status").innerHTML = "";
        document.getElementById("etiquetaEstrella").innerText = "";
        document.getElementById("infoEstrellaExtra").innerText = "";
        document.getElementById("listaEstrellas").innerHTML = "";
        document.getElementById("btnControlAudio").style.display = "none";
        speechSynthesis.cancel();
    }

    // Formatea la magnitud o devuelve '–'
    function formatMag(mag) {
        return (typeof mag === "number" && !isNaN(mag)) ? mag.toFixed(1) : '–';
    }

    // Inicia la explicación hablada y luego recorre estrellas
    function iniciarExplicacion() {
        const nombre = document.getElementById("nombre_constelacion").value.trim();
        if (descripcionConstelacion) {
            document.getElementById("status").innerText = `🔊 Hablando sobre ${nombre}…`;
            const u = new SpeechSynthesisUtterance(`${nombre}: ${descripcionConstelacion}`);
            u.lang = 'es-ES'; u.rate = 0.85;
            u.onend = recorrerEstrellas;
            speechSynthesis.speak(u);
        } else {
            recorrerEstrellas();
        }
    }

    // Lanza petición para generar recorrido y muestra botón
    function iniciarRecorrido() {
        const nombre = document.getElementById("nombre_constelacion").value.trim();
        if (!nombre) {
            document.getElementById("status").innerText = '❌ Escriba una constelación válida.';
            return;
        }
        resetRecorrido();
        const statusEl = document.getElementById("status");
        statusEl.innerHTML = `<span class="spinner"></span> Preparando recorrido para <b>${nombre}</b>…`;

        fetch('/recorrido-constelacion', {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'nombre=' + encodeURIComponent(nombre)
        })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    statusEl.innerText = data.error;
                    return;
                }

                descripcionConstelacion = data.descripcion || "";
                listaEstrellas = data.estrellas;
                const ul = document.getElementById("listaEstrellas");
                ul.innerHTML = '';

                // Aquí recuperas el listado tal y como antes:
                listaEstrellas.forEach((e, i) => {
                    const li = document.createElement('li');
                    const icon = iconByTipo[e.tipo] || iconByTipo.default;
                    const magText = formatMag(e.mag);
                    li.innerHTML = `${icon} <strong>${e.nombre}</strong>`
                        + (e.mag != null ? ` — mag ${magText}` : '');
                    li.setAttribute('data-index', i);
                    ul.appendChild(li);
                });  // ← esto es clave para que veas las estrellas :contentReference[oaicite:0]{index=0}:contentReference[oaicite:1]{index=1}

                document.getElementById('btnControlAudio').style.display = 'inline-block';

                if (batchMode) {
                    // Arrancamos YA la explicación en batch
                    iniciarExplicacion();
                } else {
                    // Modo manual: mostramos el botón de “Iniciar explicación”
                    statusEl.innerHTML = '✅ Estrellas preparadas.';
                    const btnExp = document.createElement('button');
                    btnExp.textContent = '🚀 Iniciar explicación';
                    btnExp.style.fontSize = '28px';
                    btnExp.onclick = iniciarExplicacion;
                    statusEl.appendChild(btnExp);
                }
            })
            .catch(err => {
                document.getElementById("status").innerText = '❌ Error al consultar constelación: ' + err;
            });
    }



    // Recorre secuencialmente cada estrella
    function recorrerEstrellas() {

        // Si hemos pausado, salimos y no hacemos nada
        if (recorridoPaused) return;

        if (indiceActual >= listaEstrellas.length) {
            const msg = 'Recorrido de la constelación completado.';
            document.getElementById('status').innerText = msg;
            const u = new SpeechSynthesisUtterance(msg);

            u.onend = () => {
                // Si se ha pulsado pausa mientras esperábamos, no programamos nada
                if (recorridoPaused) return;

                if (batchMode) {
                    // No volvemos a hacer batchIndex++ aquí,
                    // porque ya lo hicimos al arrancar cada constelación
                    startNextConstelacion();
                } else {
                    //obtenerDescripcionFinal();
                }
            };


            speechSynthesis.speak(u);
            return;
        }
        const est = listaEstrellas[indiceActual];
        document.getElementById('status').innerHTML = `🔭 Moviendo al objeto: <b>${est.nombre}</b>`;
        fetch('/iniciar-recorrido', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estrella: est }) })
            .then(r => r.json())
            .then(data => {
                if (data.skipped) {
                    // 1) Marcamos el ítem en gris/tachado
                    const skippedLi = document.querySelector(
                        `#listaEstrellas li[data-index="${indiceActual}"]`
                    );
                    if (skippedLi) {
                        skippedLi.classList.remove('estrella-activa');
                        skippedLi.classList.add('estrella-skip');
                    }

                    // 2) Mostramos mensaje breve de “saltado”
                    document.getElementById('status').innerHTML =
                        `🔻 Saltada <b>${est.nombre}</b>`;

                    // 3) Tras 1 segundo, avanzamos al siguiente
                    setTimeout(() => {
                        indiceActual++;
                        recorrerEstrellas();
                    }, 1000);

                    return;
                }

                // Programamos el siguiente paso tras 3s y guardamos su ID
                timeoutID = setTimeout(() => {
                    timeoutID = null;
                    if (recorridoPaused) return;

                    const voz = tipoVoz[est.tipo] || tipoVoz.default;
                    full = `${voz}: ${est.nombre}` + (est.mag != null ? `, magnitud ${formatMag(est.mag)}` : '');
                    const clave = est.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
                    const extra = est.infoExtra && est.infoExtra.trim() ? est.infoExtra : (infoExtra[clave] || '');
                    if (extra) full += `. ${extra}`;
                    document.getElementById('etiquetaEstrella').innerText = est.nombre;
                    document.getElementById('infoEstrellaExtra').innerText = extra;
                    document.querySelectorAll('#listaEstrellas li').forEach(li => li.classList.remove('estrella-activa'));
                    const act = document.querySelector(`#listaEstrellas li[data-index="${indiceActual}"]`);
                    if (act) act.classList.add('estrella-activa');
                    descripcionUtterance = new SpeechSynthesisUtterance(full);
                    descripcionUtterance.lang = 'es-ES';
                    descripcionUtterance.rate = 0.9;
                    descripcionUtterance.onend = () => { indiceActual++; recorrerEstrellas(); };
                    speechSynthesis.speak(descripcionUtterance);
                }, 3000);
            })
            .catch(err => document.getElementById('status').innerText = '❌ Error al mover telescopio: ' + err);
    }

    // Cuando el usuario pulsa el botón
    function toggleAudio() {
        if (!recorridoPaused) {
            // — Pausar —
            recorridoPaused = true;
            // 1) Detenemos la voz donde esté
            speechSynthesis.pause();
            // 2) Cancelamos cualquier retardo pendiente
            if (timeoutID !== null) {
                clearTimeout(timeoutID);
                timeoutID = null;
            }
            btnControlAudio.textContent = '▶️ Continuar';
        } else {
            // — Reanudar —
            recorridoPaused = false;
            // 1) Reanudamos la voz (si había un utterance en curso)
            speechSynthesis.resume();
            btnControlAudio.textContent = '⏸️ Pausar';
            // 2) Si no hay nada hablando, lanzamos el siguiente paso del bucle
            if (!speechSynthesis.speaking) {
                recorrerEstrellas();
            }
        }
    }
    // Reconocimiento de voz para rellenar nombre
    function reconocimientoVoz() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'es-ES'; rec.start();
        rec.onresult = e => {
            let txt = e.results[0][0].transcript.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            if (txt.startsWith('constelacion ')) {
                const val = txt.replace('constelacion ', '').trim();
                document.getElementById('nombre_constelacion').value = val;
                document.getElementById('status').innerHTML = `✅ Constelación detectada: <b>${val}</b>`;
            } else document.getElementById('status').innerText = '⚠️ Diga "constelación X".';
        };
        rec.onerror = e => document.getElementById('status').innerText = '❌ Error de reconocimiento: ' + e.error;
    }

    // Al finalizar recorrido, obtiene info de Wikipedia
    function obtenerDescripcionFinal() {
        const nom = document.getElementById('nombre_constelacion').value.trim();
        if (!nom) return;
        document.getElementById('status').innerText = '📚 Buscando descripción de la constelación...';
        fetch('/info-wikipedia', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'objeto=' + encodeURIComponent(nom + ' (constelación)') })
            .then(r => r.json()).then(d => {
                if (d.error) { document.getElementById('status').innerText = '❌ ' + d.error; return; }
                const desc = d.wikipedia_info || 'Descripción no disponible.';
                const u = new SpeechSynthesisUtterance(desc); u.lang = 'es-ES'; u.rate = 0.9;
                speechSynthesis.speak(u);
            }).catch(err => document.getElementById('status').innerText = '❌ Error al obtener info: ' + err);
    }

    // Batch completo: recorre cada constelación del .txt
    function startNextConstelacion() {
        if (batchIndex >= recorridoBatch.length) {
            const cierre = "Y con esta última constelación hemos terminado el recorrido astronómico, gracias por su atención.";
            const u = new SpeechSynthesisUtterance(cierre);
            u.onend = () => {
                document.getElementById("listaRecorridos").disabled = false;
                document.getElementById("listaRecorridos").value = "";
                batchMode = false;
            };
            speechSynthesis.speak(u);
            return;
        }
        // Cargamos la siguiente constelación y lanzamos el recorrido
        const nombre = recorridoBatch[batchIndex];
        document.getElementById("nombre_constelacion").value = nombre;
        batchIndex++;
        iniciarRecorrido();
    }

</script>

<!-- ————— Script de listbox y batch control ————— -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('listaRecorridos');
        const btn = document.getElementById('btnIniciarRecorrido');
        let audioUnlocked = false;

        // 1) Rellenar el SELECT
        fetch('/listar-txt-constelaciones')
            .then(r => r.json())
            .then(files => {
                if (!files.length) {
                    sel.innerHTML = '<option value="">(No hay recorridos disponibles)</option>';
                    return;
                }
                sel.innerHTML = '<option value="">-- SELECCIONA --</option>';
                files.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f.replace(/\.txt$/i, '');
                    sel.appendChild(opt);
                });
            })
            .catch(err => console.error('Error listando recorridos:', err));

        // 1.5) Desbloquear audio al primer gesto de usuario
        sel.addEventListener('mousedown', () => {
            if (!audioUnlocked) {
                // Llama getVoices() para activar la síntesis
                speechSynthesis.getVoices();
                audioUnlocked = true;
            }
        });

        // 2) Al cambiar selección, cargar descripción y hablarla
        sel.addEventListener('change', () => {
            const file = sel.value;
            btn.disabled = true;  // mantenemos deshabilitado hasta onend
            if (!file) {
                return;
            }

            fetch(`/leer-txt-constelacion?file=${encodeURIComponent(file)}`)
                .then(r => {
                    if (!r.ok) throw new Error('No se pudo cargar el recorrido');
                    return r.json();
                })
                .then(data => {
                    if (!data.descripcion || !Array.isArray(data.lista)) {
                        throw new Error('Formato de fichero incorrecto');
                    }
                    descripcionRecorrido = data.descripcion;
                    constelacionesRecorrido = data.lista;

                    // Construir texto de intro
                    let intro = `${descripcionRecorrido}. Ahora continuaremos con el recorrido empezando por ${constelacionesRecorrido[0]}`;
                    if (constelacionesRecorrido.length > 1) {
                        intro += ` y continuando con ${constelacionesRecorrido.slice(1).join(', ')}`;
                    }
                    intro += '. Pulse "Iniciar recorrido" para comenzar.';

                    // Crea el utterance y, al acabar, habilita el botón
                    const u = new SpeechSynthesisUtterance(intro);
                    u.lang = 'es-ES';
                    u.rate = 0.85;
                    u.onend = () => { btn.disabled = false; };
                    u.onerror = () => { btn.disabled = false; };

                    speechSynthesis.speak(u);
                })
                .catch(err => {
                    alert(err.message);
                    sel.value = '';
                    btn.disabled = true;
                });
        });

        // 3) Al pulsar “Iniciar recorrido”
        btn.addEventListener('click', () => {
            const file = sel.value;
            if (!file) {
                // Modo manual: constelación suelta
                iniciarRecorrido();
            } else {
                // Modo batch: lanzamos todas las constelaciones del .txt
                batchMode = true;
                recorridoBatch = constelacionesRecorrido.slice();
                batchIndex = 0;
                sel.disabled = true;
                btn.disabled = true;
                startNextConstelacion();
            }
        });
    });
</script>


{% endblock %}

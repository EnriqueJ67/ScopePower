<!-- templates/planetario.html -->
{% extends "base.html" %}

{% block title %}Planetario{% endblock %}

{% block head %}
<!-- Motor Celestia Atlas (static/atlas, ver ORIGEN.md). Los catálogos son scripts clásicos
     con "defer" para que estén cargados cuando arranque el módulo de abajo. -->
<script src="{{ url_for('static', filename='atlas/estrellas-brillantes.js') }}" defer></script>
<script src="{{ url_for('static', filename='atlas/hyg-star-catalog.js') }}" defer></script>
<script src="{{ url_for('static', filename='atlas/western-constellations.js') }}" defer></script>
<script src="{{ url_for('static', filename='atlas/dso-catalog.js') }}" defer></script>
<script>
    // Navegadores algo antiguos (Chrome < 98): el motor usa structuredClone para copiar objetos simples
    if (typeof window.structuredClone !== "function") window.structuredClone = function (v) { return JSON.parse(JSON.stringify(v)); };
    // Si el módulo del planetario no arranca (navegador viejo, fichero que no carga), decirlo en pantalla
    (function () {
        function avisar(texto) {
            var e = document.getElementById("estado");
            if (e && /Cargando el cielo/.test(e.textContent)) e.innerHTML = "❌ " + texto + "<br><small>Navegador: " + navigator.userAgent.replace(/^.*\((.*?)\).*?(Chrome\/[\d.]+|Safari\/[\d.]+|Firefox\/[\d.]+)?.*$/, "$1 · $2") + "</small>";
        }
        window.addEventListener("error", function (ev) {
            if (ev.target && ev.target !== window && ev.target.src) avisar("No se pudo cargar " + ev.target.src.replace(/^.*\/static\//, "static/"));
            else if (ev.message) avisar("Error al arrancar el planetario: " + ev.message);
        }, true);
        window.addEventListener("unhandledrejection", function (ev) { avisar("Error al arrancar el planetario: " + (ev.reason && ev.reason.message || ev.reason)); });
        setTimeout(function () { avisar("El planetario no ha arrancado en 20 s. Hace falta Chrome 80 o más reciente (o Safari 15); actualiza el navegador de este dispositivo."); }, 20000);
    })();
</script>
{% endblock %}

{% block content %}
<div class="card card-plana barra-atlas">
    <div class="buscador">
        <input id="buscar" type="search" placeholder="Buscar: M31, NGC 7000, Vega, Jupiter…" autocomplete="off" spellcheck="false">
        <div id="sugerencias" class="sugerencias" hidden></div>
    </div>
    <button type="button" class="btn" id="btn-modo" title="Cambiar entre horizonte (Alt/Az) y ecuatorial (RA/Dec)">Alt/Az</button>
    <button type="button" class="btn" id="btn-montura" title="Centrar el mapa donde apunta la montura" disabled><svg><use href="#i-telescopio"/></svg><span class="oculto-movil">Montura</span></button>
    <button type="button" class="btn" id="btn-centro" title="Elegir el centro del mapa (donde está el rectángulo de la cámara) para ir a ese punto aunque no haya ningún objeto"><svg><use href="#i-goto"/></svg><span class="oculto-movil">Centro</span></button>
    <label class="switch" title="El mapa sigue a la montura"><input type="checkbox" id="seguir"> Seguir</label>
    <label class="switch" title="Chinchetas con los objetos recomendados de Esta noche"><input type="checkbox" id="chinchetas" checked> Esta noche</label>
</div>

<div class="atlas-marco">
    <div id="atlas" class="atlas"></div>
    <div id="capa-noche" class="capa-noche" aria-label="Objetos recomendados esta noche"></div>
    <div id="marca-punto" class="marca-punto" hidden aria-hidden="true"></div>
    <div id="estado" class="estado-atlas"><span class="spinner"></span> Cargando el cielo…</div>
    <div id="panel" class="panel" hidden>
        <div class="panel-cab">
            <div>
                <div class="panel-nombre" id="p-nombre"></div>
                <div class="panel-datos texto-2" id="p-datos"></div>
            </div>
            <button type="button" class="btn btn-icono" id="btn-cerrar" title="Cerrar"><svg><use href="#i-cerrar"/></svg></button>
        </div>
        <div class="panel-acciones">
            <button type="button" class="btn btn-primary" id="btn-ir"><svg><use href="#i-goto"/></svg><span id="btn-ir-texto">Ir</span></button>
            <button type="button" class="btn" id="btn-centrar-mapa" title="Poner el centro del mapa (y el rectángulo de la cámara) aquí"><svg><use href="#i-planetario"/></svg>Centrar mapa</button>
            <a class="btn" id="btn-info" href="#" target="_blank" rel="noopener" hidden><svg><use href="#i-info"/></svg>Info</a>
        </div>
    </div>
</div>
<!-- Ficha de un objeto de "Esta noche" al tocar su chincheta -->
<div id="modal-objeto" class="modal" onclick="if (event.target === this) cerrarFicha()">
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre">
        <div class="modal-titulo"><span id="ficha-icono" class="ficha-icono"></span><span id="ficha-nombre"></span></div>
        <div class="texto-3" id="ficha-id" style="font-size: 13px; margin-top: -4px;"></div>
        <div class="texto-2" id="ficha-datos" style="font-size: 13.5px; margin-top: 8px;"></div>
        <p class="modal-texto" id="ficha-desc"></p>
        <div id="ficha-visib" style="font-weight: 600; font-size: 13.5px;"></div>
        <div class="texto-3" id="ficha-coords" style="font-size: 13px; margin-top: 4px;"></div>
        <div class="modal-acciones">
            <button type="button" class="btn btn-primary" id="ficha-ir"><svg><use href="#i-goto"/></svg><span id="ficha-ir-texto">Ir y centrar</span></button>
            <button type="button" class="btn" id="ficha-ver"><svg><use href="#i-planetario"/></svg>Ver en el mapa</button>
            <button type="button" class="btn" onclick="cerrarFicha()">Cerrar</button>
        </div>
    </div>
</div>

<p class="credito texto-3">Motor <a href="https://github.com/acocalypso/celestia_atlas" target="_blank" rel="noopener">Celestia Atlas</a> (MIT) ·
    estrellas HYG v4.1 y objetos OpenNGC (CC-BY-SA 4.0) · <a href="/static/atlas/THIRD_PARTY_NOTICES.md" target="_blank">créditos</a></p>

<style>
    .barra-atlas { display: flex; gap: 8px; align-items: center; padding: 10px; flex-wrap: wrap; }
    .buscador { position: relative; flex: 1 1 220px; min-width: 0; }
    .buscador input { width: 100%; }
    .sugerencias { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--radius-sm); max-height: 40vh; overflow: auto; box-shadow: var(--shadow); }
    .sugerencias div { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .sugerencias div:last-child { border-bottom: 0; }
    .sugerencias div:hover, .sugerencias div.activa { background: var(--surface-3); }
    .sugerencias small { color: var(--text-3); margin-left: 6px; }

    .atlas-marco { position: relative; margin-top: 10px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #030812; }
    .atlas { width: 100%; height: calc(100vh - var(--header-h) - var(--nav-h) - 150px); height: calc(100dvh - var(--header-h) - var(--nav-h) - 150px); min-height: 340px; touch-action: none; }
    .estado-atlas { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5; font-size: 13px; padding: 6px 10px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--bg) 78%, transparent); color: var(--text-2); pointer-events: none; }
    .estado-atlas b { color: var(--text); }

    .panel { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    @media (min-width: 700px) { .panel { left: auto; width: 340px; } }
    .panel-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .panel-nombre { font-size: 18px; font-weight: 700; line-height: 1.2; }
    .panel-datos { font-size: 13px; margin-top: 4px; line-height: 1.45; }
    .panel-acciones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn-icono { padding: 6px 8px; }

    /* Chinchetas de "Esta noche": capa HTML sobre el lienzo, recolocada a cada fotograma */
    .capa-noche { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .capa-noche[hidden] { display: none; }
    .chincheta { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; pointer-events: auto; cursor: pointer;
                 background: none; border: 0; padding: 0; color: var(--text); font: inherit; transform: translate(-12px, -12px); will-change: transform; }
    .chincheta .cuadro { width: 24px; height: 24px; box-sizing: border-box; border: 2px solid var(--ok); border-radius: 5px; background: rgba(0, 0, 0, 0.55);
                         display: grid; place-items: center; font-size: 13px; line-height: 1; box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); }
    .chincheta.tarde .cuadro { border-color: var(--warn); border-style: dashed; }
    .chincheta .etiqueta { font-size: 11.5px; font-weight: 600; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; pointer-events: none; }
    .chincheta.sin-etiqueta .etiqueta { display: none; }
    .chincheta:hover .cuadro, .chincheta:active .cuadro { background: var(--surface-3); }
    /* Punto del cielo elegido a dedo (sin objeto): círculo con cruz, recolocado como las chinchetas */
    .marca-punto { position: absolute; left: 0; top: 0; z-index: 4; width: 26px; height: 26px; margin: -13px 0 0 -13px; box-sizing: border-box;
                   border: 2px solid var(--warn); border-radius: 50%; pointer-events: none; will-change: transform; filter: drop-shadow(0 0 3px #000); }
    .marca-punto::before, .marca-punto::after { content: ""; position: absolute; background: var(--warn); }
    .marca-punto::before { left: 50%; top: -9px; bottom: -9px; width: 2px; margin-left: -1px; }
    .marca-punto::after { top: 50%; left: -9px; right: -9px; height: 2px; margin-top: -1px; }
    .marca-punto[hidden] { display: none; }
    .ficha-icono { font-size: 22px; line-height: 1; }
    .modal-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .credito { font-size: 12px; margin: 8px 2px 0; }
    .credito a { color: inherit; text-decoration: underline; }
</style>

<script type="module">
    import { createCelestiaAtlasViewer, equatorialToHorizontal, horizontalToEquatorial, calculateCameraFieldOfView,
             alignViewToHorizon, projectEquatorial, unprojectEquatorial }
        from "{{ url_for('static', filename='atlas/src/index.js') }}";

    const $ = id => document.getElementById(id);
    const estadoEl = $("estado");
    let cfg = null;               // última respuesta de /planetario/estado
    let viewer = null, observador = null, seleccionado = null;
    let modo = "horizontal", encuadrePuesto = "", gotoEnCurso = false;

    // Los catálogos vienen como globales (window.STAR_DATA, HYG_STAR_DATA, DSO_CATALOG_DATA, WESTERN_CONSTELLATIONS).
    // STAR_DATA son las 130 estrellas con nombre propio; HYG las excluye, así que se juntan.
    const stars = [...(window.STAR_DATA ?? []), ...(window.HYG_STAR_DATA ?? [])].map(s => ({ ...s, id: s.id || s.name, name: s.name || s.id,
        aliases: [...(s.aliases ?? []), ...(s.alias ? [s.alias] : [])],
        raDeg: Number.isFinite(s.raDeg) ? s.raDeg : s.ra * 15, decDeg: Number.isFinite(s.decDeg) ? s.decDeg : s.dec,
        frame: s.frame || "ICRS", type: "Star" }));
    const catalog = (window.DSO_CATALOG_DATA ?? []).map(o => ({ ...o, name: o.name || o.id,
        typeCode: o.typeCode || o.objectType || o.type,
        angularSizeArcMin: o.angularSizeArcMin ?? { major: o.major, minor: o.minor } }));

    // Nombres del Sistema Solar tal como los entiende /goto (sin acentos): el PC calcula
    // sus coordenadas con astropy, así que a esos no se les mandan RA/Dec del mapa.
    const sistemaSolar = { sun: "Sol", moon: "Luna", mercury: "Mercurio", venus: "Venus", mars: "Marte",
        jupiter: "Jupiter", saturn: "Saturno", uranus: "Urano", neptune: "Neptuno", pluto: "Pluton" };
    const tipos = { Star: "Estrella", G: "Galaxia", GPair: "Par de galaxias", GTrpl: "Trío de galaxias", GGroup: "Grupo de galaxias",
        PN: "Nebulosa planetaria", Neb: "Nebulosa", HII: "Región HII", EmN: "Nebulosa de emisión", RfN: "Nebulosa de reflexión",
        DrkN: "Nebulosa oscura", SNR: "Resto de supernova", OCl: "Cúmulo abierto", GCl: "Cúmulo globular", "Cl+N": "Cúmulo con nebulosa",
        "*Ass": "Asociación estelar", "**": "Estrella doble", "*": "Estrella", Planet: "Planeta", Moon: "Luna", Sun: "Sol", Comet: "Cometa",
        Punto: "Punto del cielo elegido en el mapa (sin objeto)" };

    function coordsDe(t) {
        const ra = t?.coordinates?.raDeg ?? t?.raDeg, dec = t?.coordinates?.decDeg ?? t?.decDeg;
        return Number.isFinite(ra) && Number.isFinite(dec) ? { raDeg: ra, decDeg: dec, frame: t.coordinates?.frame || t.frame || "ICRS" } : null;
    }
    const horas = raDeg => { const h = raDeg / 15, m = (h % 1) * 60; return `${Math.floor(h)}h ${m.toFixed(1).padStart(4, "0")}m`; };
    const grados = d => `${d < 0 ? "−" : "+"}${Math.floor(Math.abs(d))}° ${((Math.abs(d) % 1) * 60).toFixed(0).padStart(2, "0")}′`;

    async function iniciar() {
        try {
            cfg = await (await fetch("/planetario/estado")).json();
        } catch (e) {
            estadoEl.innerHTML = "❌ No se pudo leer el estado del PC: " + e;
            return;
        }
        observador = { latitudeDeg: cfg.observador.latitud, longitudeDeg: cfg.observador.longitud, elevationM: cfg.observador.altitud };
        try {
            viewer = createCelestiaAtlasViewer({
                container: $("atlas"), catalog, stars, constellations: window.WESTERN_CONSTELLATIONS ?? {},
                observer: observador, utcMs: cfg.hora_utc_ms,
                skySurveySource: null,          // sin teselas DSS: todo local
                onSelect: t => { tocoObjeto = true; mostrarPanel(t); },
                onError: e => console.error("atlas", e),
            });
        } catch (e) {
            estadoEl.innerHTML = "❌ El navegador no puede dibujar el planetario: " + e.message;
            return;
        }
        window.viewer = viewer;
        viewer.setCoordinateMode(modo);
        viewer.setDisplayOptions({ cardinals: true, constellations: true, labels: true, horizon: true, hideBelowHorizon: true,
            milkyWay: true, solarSystem: true, comets: true, atmosphere: false,
            starMagnitudeLimit: 6.5, deepSkyMagnitudeLimit: 11.5, galaxyMagnitudeLimit: 11.5 });
        if (cfg.altura_minima > 0) {   // la altura mínima de config.ini, como horizonte del observatorio
            viewer.setHorizon([0, 90, 180, 270].map(az => ({ azimuthDeg: az, altitudeDeg: cfg.altura_minima })));
        }
        aplicarTema();
        // Vista inicial: mirando al sur, a 45° de altura, campo ancho
        try {
            const centro = horizontalToEquatorial({ azimuthDeg: 180, altitudeDeg: 45 }, observador, cfg.hora_utc_ms, "ICRS");
            viewer.setView({ center: { raDeg: centro.raDeg, decDeg: centro.decDeg, frame: "ICRS" }, fovDeg: 90 });
        } catch (e) { console.warn("vista inicial", e); }
        // El motor no puede dibujar con un canvas de 0×0 (pestaña en segundo plano,
        // página aún oculta): solo se anima cuando el contenedor tiene tamaño y está visible.
        new ResizeObserver(sincronizarVisibilidad).observe($("atlas"));
        sincronizarVisibilidad();
        aplicarEstado(cfg);
        if (cfg.montura?.conectada) viewer.focusMount();
        setInterval(refrescar, 2000);
        cargarEstaNoche();
        setInterval(cargarEstaNoche, 5 * 60 * 1000);   // la visibilidad "ahora" cambia
        requestAnimationFrame(recolocarChinchetas);
    }

    function sincronizarVisibilidad() {
        if (!viewer) return;
        const caja = $("atlas");
        const visible = !document.hidden && caja.clientWidth > 0 && caja.clientHeight > 0;
        if (visible) { viewer.resume(); viewer.resize(); } else viewer.pause();
    }

    async function refrescar() {
        if (document.hidden || !viewer) return;
        try { cfg = await (await fetch("/planetario/estado")).json(); } catch (e) { return; }
        aplicarEstado(cfg);
    }

    function aplicarEstado(c) {
        // Reloj del PC (si el móvil y el PC difieren, manda el PC, que es quien mueve la montura)
        if (Math.abs(viewer.getTime() - c.hora_utc_ms) > 3000) viewer.setTime(c.hora_utc_ms);
        // Marcador de la montura
        const m = c.montura || {};
        if (m.conectada && Number.isFinite(m.ra_h)) {
            viewer.setMountPosition({ coordinates: { raDeg: m.ra_h * 15, decDeg: m.dec_deg, frame: "J2000" },
                connected: true, stale: false, timestampUtcMs: c.hora_utc_ms });
        } else {
            viewer.setMountPosition(null);
        }
        $("btn-montura").disabled = !m.conectada;
        ponerEncuadre();
        $("btn-ir-texto").textContent = c.centrar_tras_goto ? "Ir y centrar" : "Ir";
        pintarEstado(c);
    }

    // Rectángulo de la cámara: tamaño del sensor y focal (cuando se conocen) y el giro de la
    // cámara en el tubo que midió el último plate solving (CROTA2 del .ini de ASTAP; sin él, 0°).
    // Se vuelve a poner si cambia el giro o el modo del mapa: en Alt/Az el motor pinta el cielo
    // como se ve, pero en RA/Dec lo pinta en espejo (este a la derecha) y su rotación del
    // rectángulo no lo compensa, así que ahí hace falta la convención contraria (comprobado
    // proyectando el borde de una foto real con su WCS).
    function ponerEncuadre() {
        const c = cfg;
        if (!viewer || !c?.camara?.ancho_px || !c.camara.pixel_um || !c.focal_mm) return;
        const rot = c.rotacion_camara?.grados, rotDeg = Number.isFinite(rot) ? rot : 0;
        const clave = `${rotDeg}|${modo}`;
        if (clave === encuadrePuesto) return;
        try {
            const cam = calculateCameraFieldOfView({ sensorWidthPx: c.camara.ancho_px, sensorHeightPx: c.camara.alto_px,
                pixelSizeMicrons: c.camara.pixel_um, focalLengthMm: c.focal_mm });
            viewer.setFieldOfView({ widthDeg: cam.widthDeg, heightDeg: cam.heightDeg, rotationDeg: rotDeg,
                rotationConvention: modo === "horizontal" ? "clockwise-from-celestial-north" : "counterclockwise-from-celestial-north" });
            encuadrePuesto = clave;
        } catch (e) { console.warn("encuadre", e); }
    }

    function pintarEstado(c) {
        if (gotoEnCurso) return;   // mientras /goto responde se muestra su propio mensaje
        const m = c.montura || {}, cen = c.centrado || {};
        let txt;
        if (!m.conectada && m.error) txt = `⚠️ La montura no responde (${m.error}). Comprueba SynScan Pro y que la montura esté encendida`;
        else if (!m.conectada) txt = "Montura no conectada: el mapa funciona, pero no se puede ir a los objetos";
        else if (cen.en_curso) txt = `🎯 Centrando <b>${cen.objeto || ""}</b> (vuelta ${cen.vuelta}/${cen.max_vueltas}): ${cen.mensaje || ""}`;
        else if (m.slewing) txt = `↗ Montura moviéndose${c.ultimo_goto?.objeto ? " a <b>" + c.ultimo_goto.objeto + "</b>" : ""}…`;
        else txt = `Montura en RA ${horas(m.ra_h * 15)} · Dec ${grados(m.dec_deg)}` +
            (c.ultimo_goto?.objeto ? ` · último GoTo: <b>${c.ultimo_goto.objeto}</b>` : "") +
            (cen.terminado && cen.resultado ? ` · centrado: ${cen.resultado}` : "") +
            (Number.isFinite(c.rotacion_camara?.grados) ? ` · cámara girada ${c.rotacion_camara.grados.toFixed(0)}°` : "");
        estadoEl.innerHTML = txt;
    }

    // ——— Selección y GoTo ———
    function mostrarPanel(t) {
        seleccionado = t || null;
        const p = $("panel");
        const c = coordsDe(t);
        // La marca solo se pinta para puntos elegidos a dedo; los objetos ya los recuadra el motor
        puntoLibre = t?.libre && c ? c : null;
        if (!puntoLibre) $("marca-punto").hidden = true;
        if (!t) { p.hidden = true; return; }
        const nombre = t.displayName || t.name;
        $("p-nombre").textContent = nombre;
        const partes = [tipos[t.typeCode] || tipos[t.type] || t.type || t.typeCode || ""];
        const mag = t.mag ?? t.magnitude;
        if (Number.isFinite(mag)) partes.push(`mag ${(+mag).toFixed(1)}`);
        let html = partes.filter(Boolean).join(" · ");
        if (c) {
            let alt = "";
            try {
                const h = equatorialToHorizontal(c, observador, viewer.getTime());
                alt = `<br>Alt ${h.altitudeDeg.toFixed(1)}° · Az ${h.azimuthDeg.toFixed(1)}°`;
                if (h.altitudeDeg < (cfg?.altura_minima ?? 0)) alt += ` <span style="color: var(--warn)">· bajo la altura mínima (${cfg.altura_minima}°)</span>`;
            } catch (e) {}
            html += `<br>RA ${horas(c.raDeg)} · Dec ${grados(c.decDeg)}${alt}`;
        }
        $("p-datos").innerHTML = html;
        $("btn-ir").disabled = !c;
        $("btn-centrar-mapa").disabled = !c;
        p.hidden = false;
    }
    $("btn-cerrar").onclick = () => mostrarPanel(null);
    $("btn-centrar-mapa").onclick = () => {
        const c = coordsDe(seleccionado);
        if (c) viewer.setView({ center: { raDeg: c.raDeg, decDeg: c.decDeg, frame: "ICRS" }, fovDeg: viewer.getView().fovDeg });
    };

    // ——— Puntos del cielo sin objeto (para encuadrar, p. ej. entre M81 y M82) ———
    // El rectángulo de la cámara se dibuja siempre en el centro del mapa: se arrastra el mapa
    // hasta que lo que se quiere retratar quede dentro y se va a ese centro. También se puede
    // tocar cualquier sitio vacío del cielo; el motor solo avisa cuando se toca un objeto, así
    // que un toque sin selección se convierte aquí en RA/Dec con la proyección inversa.
    let puntoLibre = null;        // {raDeg, decDeg} del punto elegido a dedo, para la marca
    const horasCortas = raDeg => { const h = raDeg / 15; return `${Math.floor(h)}h${Math.round((h % 1) * 60).toString().padStart(2, "0")}m`; };
    const gradosCortos = d => `${d < 0 ? "-" : "+"}${Math.floor(Math.abs(d))}°${Math.round((Math.abs(d) % 1) * 60).toString().padStart(2, "0")}'`;
    function seleccionarPunto(c) {
        // Se pasa por viewer.select para que el motor suelte el objeto que tuviera recuadrado;
        // el motor devuelve el mismo objeto (con "libre") por onSelect → mostrarPanel.
        const nombre = `Campo ${horasCortas(c.raDeg)} ${gradosCortos(c.decDeg)}`;
        viewer.select({ id: "punto-libre", name: nombre, displayName: "Punto del cielo", type: "Punto", libre: true,
                        coordinates: { raDeg: c.raDeg, decDeg: c.decDeg, frame: "ICRS" } });
    }
    function vistaProyectada() {
        const vista = viewer.getView();
        return modo === "horizontal" ? alignViewToHorizon(vista, observador, viewer.getTime()) : vista;
    }
    $("btn-centro").onclick = () => { if (viewer) seleccionarPunto(viewer.getView().center); };

    // Toque en cielo vacío: mismo criterio que el motor (un solo dedo, sin arrastrar). El motor
    // atiende el pointerup en su canvas antes de que llegue aquí, así que si ha seleccionado
    // algo (tocoObjeto) no se hace nada.
    const lienzo = $("atlas");
    let toque = null, tocoObjeto = false, dedos = 0;
    lienzo.addEventListener("pointerdown", e => {
        dedos++;
        if (dedos === 1) { toque = { x: e.clientX, y: e.clientY, id: e.pointerId, ok: true }; tocoObjeto = false; }
        else if (toque) toque.ok = false;   // pellizco: no es un toque
    });
    lienzo.addEventListener("pointermove", e => { if (toque && e.pointerId === toque.id && Math.hypot(e.clientX - toque.x, e.clientY - toque.y) > 6) toque.ok = false; });
    const soltar = e => {
        dedos = Math.max(0, dedos - 1);
        if (!toque || e.pointerId !== toque.id) return;
        const t = toque; toque = null;
        if (!t.ok || tocoObjeto || !viewer || e.type !== "pointerup") return;
        const r = lienzo.getBoundingClientRect(), w = lienzo.clientWidth, h = lienzo.clientHeight;
        if (!w || !h) return;
        try { seleccionarPunto(unprojectEquatorial(e.clientX - r.left, e.clientY - r.top, vistaProyectada(), w, h)); }
        catch (err) { console.warn("punto del cielo", err); }
    };
    lienzo.addEventListener("pointerup", soltar);
    lienzo.addEventListener("pointercancel", soltar);

    // Nombre que se manda a /goto: para el Sistema Solar el nombre en español (el PC calcula
    // la posición); para el cielo profundo la designación de catálogo (M31, NGC 7000), que es
    // lo que entienden el catálogo propio, la voz y las descripciones; para estrellas, su nombre.
    const designacion = /^(M|NGC|IC|C|B|Sh2|LDN|LBN|Abell|Cr|Mel|Tr|Ced|vdB|RCW)\s?\d/i;
    function nombreParaGoto(t) {
        if (t.libre) return { objeto: t.name, conCoords: true };
        const clave = String(t.name || "").toLowerCase();
        if (sistemaSolar[clave]) return { objeto: sistemaSolar[clave], conCoords: false };
        const id = String(t.id || "");
        if (designacion.test(id)) return { objeto: id.replace(/^M0+(\d)/, "M$1"), conCoords: true };
        return { objeto: t.name || t.displayName, conCoords: true };
    }

    // Envía el GoTo por la misma ruta que la página GoTo y "Esta noche". Con ra_h/dec_deg
    // el PC no tiene que resolver el nombre; sin ellas (Sistema Solar) lo calcula él.
    async function enviarGoto(objeto, ra_h, dec_deg, boton) {
        let cuerpo = "objeto=" + encodeURIComponent(objeto);
        if (Number.isFinite(ra_h) && Number.isFinite(dec_deg)) cuerpo += `&ra=${ra_h}&dec=${dec_deg}`;
        gotoEnCurso = true;
        if (boton) boton.disabled = true;
        estadoEl.innerHTML = `<span class="spinner"></span> Enviando GoTo a <b>${objeto}</b>…`;
        let ok = false;
        try {
            const r = await (await fetch("/goto", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: cuerpo })).json();
            if (r.error) estadoEl.innerHTML = "❌ " + r.error;
            else if (r.warning) estadoEl.innerHTML = "⚠️ " + r.warning;
            else estadoEl.innerHTML = r.message || "✅ GoTo enviado";
            ok = !r.error && !r.warning;
            if (ok) { $("seguir").checked = true; viewer.setMountFollow(true); }
        } catch (e) {
            estadoEl.innerHTML = "❌ " + e;
        }
        setTimeout(() => { gotoEnCurso = false; }, 4000);   // dejar leer la respuesta antes de volver al estado normal
        if (boton) boton.disabled = false;
        return ok;
    }

    $("btn-ir").onclick = () => {
        if (!seleccionado) return;
        const c = coordsDe(seleccionado);
        const { objeto, conCoords } = nombreParaGoto(seleccionado);
        enviarGoto(objeto, conCoords && c ? c.raDeg / 15 : NaN, conCoords && c ? c.decDeg : NaN, $("btn-ir"));
    };

    // ——— Chinchetas de "Esta noche" ———
    // Los objetos recomendados (mismo cálculo que la página Esta noche) se pintan como
    // cuadraditos HTML encima del lienzo, proyectados con la misma función que usa el motor.
    const iconosTipo = { "Galaxia": "🌌", "Nebulosa": "☁️", "Nebulosa planetaria": "💍", "Cúmulo abierto": "✨", "Cúmulo globular": "🔮",
                         "Resto de supernova": "💥", "Planeta": "🪐", "Luna": "🌙", "Nebulosa oscura": "🐴", "Cometa": "☄️", "Asteroide": "🪨" };
    const capa = $("capa-noche");
    let chinchetas = [];          // [{o, el}]
    let fichaActual = null;

    async function cargarEstaNoche() {
        try {
            const d = await (await fetch("/esta-noche/objetos")).json();
            if (d.error) throw new Error(d.error);
            capa.innerHTML = "";
            // Solo lo que se ve esta noche (ahora o más tarde); lo que no sube de la altura mínima no se pinta
            chinchetas = d.objetos.filter(o => o.visible_ahora || o.visible_desde).map(o => {
                const el = document.createElement("button");
                el.type = "button";
                el.className = "chincheta " + (o.visible_ahora ? "ahora" : "tarde");
                el.title = o.nombre + (o.visible_ahora ? ` · ahora a ${o.alt_ahora}°` : ` · visible desde las ${o.visible_desde}`);
                el.innerHTML = `<span class="cuadro">${iconosTipo[o.tipo] || "🔭"}</span><span class="etiqueta">${o.nombre}</span>`;
                el.hidden = true;
                el.addEventListener("click", ev => { ev.stopPropagation(); abrirFicha(o); });
                capa.appendChild(el);
                return { o, el };
            });
        } catch (e) {
            console.warn("Esta noche no disponible para el planetario:", e);
        }
    }

    let ultimaRecolocacion = 0;
    function recolocarChinchetas(t) {
        requestAnimationFrame(recolocarChinchetas);
        const hayChinchetas = !capa.hidden && chinchetas.length > 0;
        if (!viewer || (!hayChinchetas && !puntoLibre) || t - ultimaRecolocacion < 80) return;   // ~12 veces por segundo basta
        ultimaRecolocacion = t;
        const w = $("atlas").clientWidth, h = $("atlas").clientHeight;
        if (!w || !h) return;
        let vista, ahora;
        try {
            vista = viewer.getView(); ahora = viewer.getTime();
            if (modo === "horizontal") vista = alignViewToHorizon(vista, observador, ahora);
        } catch (e) { return; }
        if (puntoLibre) {   // la marca del punto elegido a dedo, con la misma proyección
            const marca = $("marca-punto");
            let p = null;
            try { p = projectEquatorial({ ...puntoLibre, frame: "ICRS" }, vista, w, h); } catch (e) {}
            const visible = p && p.x >= 0 && p.x <= w && p.y >= 0 && p.y <= h;
            marca.hidden = !visible;
            if (visible) marca.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px)`;
        }
        if (!hayChinchetas) return;
        const conEtiqueta = vista.fovDeg <= 100;
        for (const { o, el } of chinchetas) {
            const coords = { raDeg: o.ra_h * 15, decDeg: o.dec_deg, frame: "ICRS" };
            let p = null;
            try {
                const hz = equatorialToHorizontal(coords, observador, ahora);
                if (hz.altitudeDeg >= 0) p = projectEquatorial(coords, vista, w, h);   // bajo el horizonte no se pinta, como el motor
            } catch (e) {}
            const visible = p && p.x >= -20 && p.x <= w + 20 && p.y >= -20 && p.y <= h + 20;
            if (!visible) { if (!el.hidden) el.hidden = true; continue; }
            if (el.hidden) el.hidden = false;
            el.classList.toggle("sin-etiqueta", !conEtiqueta);
            el.style.transform = `translate(${(p.x - 12).toFixed(1)}px, ${(p.y - 12).toFixed(1)}px)`;
        }
    }

    function abrirFicha(o) {
        fichaActual = o;
        $("ficha-icono").textContent = iconosTipo[o.tipo] || "🔭";
        $("ficha-nombre").textContent = o.nombre;
        $("ficha-id").textContent = [o.id !== o.nombre ? o.id : "", o.nombre_alt && o.nombre_alt !== o.id ? o.nombre_alt : ""].filter(Boolean).join(" · ");
        const estrellas = "★".repeat(o.popularidad || 0) + "☆".repeat(Math.max(0, 5 - (o.popularidad || 0)));
        $("ficha-datos").innerHTML = [o.tipo, o.constelacion, o.mag !== null && o.mag !== undefined ? `mag ${o.mag}` : "", o.tamano_arcmin ? `${o.tamano_arcmin}′` : ""]
            .filter(Boolean).join(" · ") + ` <span style="color: var(--warn); letter-spacing: 1px; font-size: 12px;">${estrellas}</span>`;
        $("ficha-desc").textContent = o.descripcion || "";
        const v = $("ficha-visib");
        if (o.visible_ahora) { v.style.color = "var(--ok)"; v.textContent = `Visible ahora a ${o.alt_ahora}° · máximo ${o.alt_max}° a las ${o.hora_max}`; }
        else { v.style.color = "var(--warn)"; v.textContent = `Visible de ${o.visible_desde} a ${o.visible_hasta} · máximo ${o.alt_max}° a las ${o.hora_max}`; }
        let coords = `RA ${horas(o.ra_h * 15)} · Dec ${grados(o.dec_deg)}`;
        try { const hz = equatorialToHorizontal({ raDeg: o.ra_h * 15, decDeg: o.dec_deg, frame: "ICRS" }, observador, viewer.getTime()); coords += ` · Alt ${hz.altitudeDeg.toFixed(1)}° · Az ${hz.azimuthDeg.toFixed(1)}°`; } catch (e) {}
        $("ficha-coords").textContent = coords;
        $("ficha-ir-texto").textContent = cfg?.centrar_tras_goto ? "Ir y centrar" : "Ir";
        $("ficha-ir").className = "btn " + (o.visible_ahora ? "btn-primary" : "btn-secondary");
        $("modal-objeto").classList.add("abierto");
    }
    window.cerrarFicha = () => { $("modal-objeto").classList.remove("abierto"); fichaActual = null; };
    $("ficha-ir").onclick = async () => {
        if (!fichaActual) return;
        const o = fichaActual;
        // Igual que el botón "Ir y centrar" de Esta noche: nombre + coordenadas del catálogo propio
        const ok = await enviarGoto(o.nombre, o.ra_h, o.dec_deg, $("ficha-ir"));
        if (ok) cerrarFicha();
    };
    $("ficha-ver").onclick = () => {
        if (!fichaActual) return;
        viewer.setView({ center: { raDeg: fichaActual.ra_h * 15, decDeg: fichaActual.dec_deg, frame: "ICRS" }, fovDeg: 15 });
        cerrarFicha();
    };
    $("chinchetas").onchange = e => { capa.hidden = !e.target.checked; };
    document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarFicha(); });

    // ——— Búsqueda ———
    const inp = $("buscar"), sug = $("sugerencias");
    let resultados = [];
    function elegir(r) {
        viewer.focusTarget(r); viewer.select(r); mostrarPanel(r);
        sug.hidden = true; inp.value = ""; inp.blur();
    }
    inp.addEventListener("input", () => {
        const q = inp.value.trim();
        sug.innerHTML = ""; resultados = [];
        if (!viewer || q.length < 2) { sug.hidden = true; return; }
        resultados = viewer.search(q).slice(0, 8);
        for (const r of resultados) {
            const d = document.createElement("div");
            const tipo = tipos[r.typeCode] || tipos[r.type] || "";
            d.innerHTML = `${r.displayName || r.name}${tipo ? `<small>${tipo}</small>` : ""}`;
            d.onclick = () => elegir(r);
            sug.appendChild(d);
        }
        sug.hidden = resultados.length === 0;
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && resultados[0]) { e.preventDefault(); elegir(resultados[0]); } if (e.key === "Escape") sug.hidden = true; });
    document.addEventListener("click", e => { if (!e.target.closest(".buscador")) sug.hidden = true; });

    // ——— Botones de la barra ———
    $("btn-modo").onclick = () => {
        modo = modo === "horizontal" ? "equatorial" : "horizontal";
        viewer?.setCoordinateMode(modo);
        $("btn-modo").textContent = modo === "horizontal" ? "Alt/Az" : "RA/Dec";
        ponerEncuadre();   // la convención del giro del rectángulo depende del modo
    };
    $("btn-montura").onclick = () => viewer?.focusMount();
    $("seguir").onchange = e => viewer?.setMountFollow(e.target.checked);

    // ——— Tema (noche = rojo → modo noche del atlas), visibilidad y tamaño ———
    function aplicarTema() {
        const noche = document.documentElement.getAttribute("data-tema") !== "oscuro";
        viewer?.setDisplayOptions({ nightMode: noche });
    }
    new MutationObserver(aplicarTema).observe(document.documentElement, { attributes: true, attributeFilter: ["data-tema"] });
    document.addEventListener("visibilitychange", sincronizarVisibilidad);
    window.addEventListener("resize", sincronizarVisibilidad);
    document.addEventListener("fullscreenchange", () => setTimeout(sincronizarVisibilidad, 100));

    iniciar();
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}GOTO Objeto Celeste{% endblock %}

{% block content %}
<h2>GOTO Objeto Celeste</h2>

<div id="config" data-palabra-clave="{{ palabra_clave }}"></div>

<div id="estado_stellarium" style="margin-bottom: 10px; font-size: 0.9em; color: gray;">
    Verificando estado de Stellarium...
</div>

<!-- En pantallas anchas (tablet, móvil apaisado) el formulario va a la izquierda
     y el estado + información del objeto a la derecha -->
<div class="goto-layout">
    <form id="gotoForm">
        <label for="objeto">Nombre del Objeto:</label>
        <input type="text" id="objeto" name="objeto" required autocomplete="off">

        <button type="button" class="principal" onclick="sendGotoRequest()">🔭 GOTO</button>
        <div class="botones">
            <button type="button" onclick="startSpeechRecognition()">🎙️ Voz-GOTO</button>
            <button type="button" onclick="toggleContinuousRecognition()">🎙️ Voz cont.-GOTO</button>
            <button id="btnModoAutomatico" type="button" onclick="lanzarModoAutomatico()" disabled>🎯 Centrado Automático</button>
            <button id="btnInfoAudio" type="button" onclick="toggleAudio()">📢 Hablar info</button>
        </div>
    </form>

    <div class="goto-info vacia">
        <p id="status"></p>
        <div id="extraInfo"></div>
    </div>
</div>

<style>
    .goto-layout { display: grid; grid-template-columns: 1fr; gap: 10px 24px; align-items: start; }

    #gotoForm { width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; }
    #gotoForm label { display: block; margin-bottom: 8px; font-size: 22px; font-weight: bold; }
    #gotoForm input[type="text"] {
        width: 100%; padding: 14px; font-size: 24px; margin-bottom: 12px;
        border: 2px solid #770000; border-radius: 10px; background-color: #220000; color: #ffcccc; box-sizing: border-box;
    }
    #gotoForm button {
        display: block; width: 100%; margin: 8px 0; padding: 16px; font-size: 22px;
        background-color: #550000; color: #ffcccc; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
    }
    #gotoForm button.principal { background-color: #7a0000; padding: 20px; font-size: 26px; }
    #gotoForm button:hover { background-color: #770000; }
    #gotoForm button:disabled { opacity: 0.45; cursor: default; }
    #gotoForm .botones { display: grid; grid-template-columns: 1fr; gap: 0 10px; }

    .goto-info { min-width: 0; }
    #status { font-size: 20px; margin: 10px 0; word-wrap: break-word; }
    #extraInfo { font-size: 16px; margin-top: 12px; }
    #extraInfo ul { padding-left: 20px; }

    .spinner {
        display: inline-block; width: 24px; height: 24px; border: 4px solid #ccc; border-top: 4px solid #ffcccc;
        border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Pantalla ancha: botones secundarios en pareja */
    @media (min-width: 700px) {
        #gotoForm .botones { grid-template-columns: 1fr 1fr; }
        #gotoForm label { font-size: 24px; }
        #gotoForm input[type="text"] { font-size: 26px; }
        #status { font-size: 22px; margin-top: 0; }
        #extraInfo { font-size: 17px; }
    }

    /* Apaisado (tablet o móvil tumbado): formulario a la izquierda, estado e info a la derecha */
    @media (min-width: 700px) and (orientation: landscape) {
        .goto-layout { grid-template-columns: minmax(300px, 5fr) 4fr; }
        #gotoForm { margin: 0; }
        .goto-info:empty::before, .goto-info.vacia::before {
            content: "Aquí aparecerá el estado del movimiento y la información del objeto.";
            color: #886666; font-size: 15px;
        }
    }

    /* Tablet en vertical: hay ancho pero sobra altura, botones más grandes */
    @media (min-width: 700px) and (orientation: portrait) {
        #gotoForm button { padding: 22px; font-size: 28px; }
        #gotoForm button.principal { padding: 28px; font-size: 34px; }
        #gotoForm input[type="text"] { font-size: 34px; padding: 20px; }
        #gotoForm label { font-size: 30px; }
        #status { font-size: 26px; }
        #extraInfo { font-size: 20px; }
    }

    /* Móvil apaisado (poca altura): compactar para que quepa sin tanto scroll */
    @media (max-height: 500px) and (orientation: landscape) {
        h2 { font-size: 20px; margin: 4px 0; }
        #estado_stellarium { margin-bottom: 4px; }
        #gotoForm label { font-size: 18px; margin-bottom: 4px; }
        #gotoForm input[type="text"] { font-size: 20px; padding: 10px; margin-bottom: 8px; }
        #gotoForm button { padding: 10px; font-size: 18px; margin: 6px 0; }
        #gotoForm button.principal { padding: 12px; font-size: 20px; }
        #status { font-size: 18px; }
    }
</style>

<!-- La pantalla se mantiene encendida desde base.html (static/js/pantalla.js) -->
<script src="{{ url_for('static', filename='centrado.js') }}"></script>
<script>
    const palabraClave = document.getElementById("config").dataset.palabraClave.toLowerCase();
    const sonidoClick = new Audio("/static/click.wav");

    var infoUtterance = null;


    // Variable global para guardar el tipo (sufijo) obtenido de Stellarium
    window.tipoObjeto = "";

    let recognition;
    let recognizing = false;
    let recognitionRunning = false;

    // ——— Reconocimiento de voz ———
    // Chrome solo permite el micrófono en páginas "seguras": HTTPS o localhost. Por
    // http://192.168.x.x falla en silencio con el error "not-allowed", y además el
    // reconocimiento de Chrome se hace en los servidores de Google: sin Internet en
    // el móvil da "network". Aquí se explica en pantalla en vez de no hacer nada.
    const ERRORES_VOZ = {
        "not-allowed": "El navegador no deja usar el micrófono. Si la dirección empieza por http:// (sin s), Chrome lo bloquea: " +
                       "escribe chrome://flags/#unsafely-treat-insecure-origin-as-secure en el móvil, añade " + location.origin + ", activa la opción y reinicia Chrome. " +
                       "Si ya es https, revisa el permiso de micrófono de este sitio.",
        "service-not-allowed": "El reconocimiento de voz está desactivado en este navegador.",
        "network": "Chrome reconoce la voz en Internet: el móvil necesita conexión de datos o wifi con salida a Internet.",
        "no-speech": "No se ha oído nada. Vuelve a pulsar y habla enseguida.",
        "audio-capture": "No se encuentra ningún micrófono.",
        "aborted": "Escucha cancelada.",
        "language-not-supported": "El navegador no reconoce español.",
    };

    function crearReconocimiento() {
        const Clase = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Clase) {
            document.getElementById('status').innerHTML = "❌ Este navegador no tiene reconocimiento de voz. En Android usa Chrome.";
            return null;
        }
        if (!window.isSecureContext) {
            document.getElementById('status').innerHTML = "⚠️ " + ERRORES_VOZ["not-allowed"];
            // Se intenta igualmente: en algunos navegadores funciona
        }
        const r = new Clase();
        r.lang = 'es-ES';
        return r;
    }

    function explicarErrorVoz(event) {
        const msg = ERRORES_VOZ[event.error] || ("Error de reconocimiento: " + event.error);
        document.getElementById('status').innerHTML = "❌ " + msg;
        console.warn("Reconocimiento de voz:", event.error, event.message || "");
    }

    // Samsung Internet (y a veces Chrome) entrega el mismo resultado dos veces:
    // una provisional y otra final, o dos finales seguidos. Sin este filtro se
    // lanzaban dos GOTO y se oía todo dos veces.
    let ultimaFraseVoz = "", ultimaFraseVozHora = 0;
    function textoFinalDe(event) {
        for (let i = event.results.length - 1; i >= 0; i--) {
            const r = event.results[i];
            if (r.isFinal === undefined || r.isFinal) return r[0].transcript.trim();
        }
        return null;
    }
    function fraseRepetida(texto) {
        const ahora = Date.now();
        if (texto === ultimaFraseVoz && ahora - ultimaFraseVozHora < 8000) return true;
        ultimaFraseVoz = texto; ultimaFraseVozHora = ahora;
        return false;
    }

    function startSpeechRecognition() {
        recognition = crearReconocimiento();
        if (!recognition) return;
        recognition.onstart = () => document.getElementById('status').innerHTML = "🎙️ Escuchando... di el nombre del objeto";
        recognition.onerror = explicarErrorVoz;
        recognition.onend = () => { if (document.getElementById('status').innerHTML.startsWith("🎙️ Escuchando")) document.getElementById('status').innerHTML = "🎙️ No se ha entendido nada; prueba otra vez."; };
        try {
            recognition.start();
        } catch (e) {
            document.getElementById('status').innerHTML = "❌ No se pudo iniciar la escucha: " + e.message;
            return;
        }

        recognition.onresult = function (event) {
            var texto = textoFinalDe(event);
            if (!texto) return;
            texto = texto.replace(/[¿?.,!¡;-]/g, ""); // Aquí también
            texto = texto.normalize("NFD").replace(/[̀-ͯ]/g, "");
            if (fraseRepetida(texto)) return;
            try { recognition.stop(); } catch (e) {}     // una sola escucha: no seguir recibiendo resultados
            document.getElementById('objeto').value = texto;
            setTimeout(sendGotoRequest, 500);
        };
    }

    function toggleContinuousRecognition() {
        if (recognizing) {
            recognition.stop();
            recognizing = false;
            document.getElementById('status').innerHTML = "🛑 Auto-GOTO desactivado.";
            return;
        }

        recognition = crearReconocimiento();
        if (!recognition) return;
        recognition.continuous = true;
        recognition.interimResults = false;

        recognizing = true;

        document.getElementById('status').innerHTML = "🎙️ Auto-GOTO activado. Hable para mover el telescopio.";

        recognition.onstart = () => recognitionRunning = true;
        recognition.onend = () => {
            recognitionRunning = false;
            if (recognizing) {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (err) {
                        console.warn("No se pudo reiniciar el reconocimiento:", err);
                    }
                }, 500);
            }
        };

        recognition.onresult = function (event) {
            const results = event.results;


            var texto = textoFinalDe(event);
            if (!texto) return;
            texto = texto.toLowerCase(); // 👈 Convierte todo a minúsculas
            texto = texto.replace(/[¿?.,!¡;-]/g, ""); // 🧼 Elimina signos de puntuación
            texto = texto.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // Elimina acentos

            console.log("Voz detectada:", texto);
            if (fraseRepetida(texto)) return;

            if (texto.startsWith(palabraClave + " ")) {
                texto = texto.substring(palabraClave.length).trim();
                document.getElementById('objeto').value = texto;
                sonidoClick.play();
                sendGotoRequest();
            } else {
                document.getElementById('status').innerHTML = `⚠️ Debe decir "<b>${palabraClave}</b>" antes del objeto.`;
            }
        };

        recognition.onerror = function (event) {
            console.warn("Error de reconocimiento:", event.error);
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed' || event.error === 'audio-capture') {
                recognizing = false;              // no tiene sentido reintentar sin micrófono
                explicarErrorVoz(event);
                return;
            }
            if (event.error === 'network') explicarErrorVoz(event);

            if ((event.error === 'no-speech' || event.error === 'network') && recognizing && !recognitionRunning) {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.warn("Recognition ya en marcha.");
                    }
                }, 500);
            }
        };

        try {
            recognition.start();
            sonidoClick.play();
        } catch (err) {
            console.warn("Error al iniciar reconocimiento:", err);
        }
    }


    function getIconForType(type) {
        if (!type) return "❓";
        const icons = {
            "star": "⭐",
            "planet": "🪐",
            "galaxy": "🌌",
            "nebula": "☁️",
            "asteroid": "🪨",
            "comet": "☄️",
            "moon": "🌕",
            "constellation": "✨",
            "cluster": "🔘",
            "double star": "🌟🌟"
        };
        return icons[type.toLowerCase()] || "🔭";
    }

    // Espera al fin del movimiento (algoritmo de la versión de junio): primero
    // a que el driver diga Slewing=true (evita leer "parado" antes de que la
    // montura arranque) y después a que vuelva a false. Si en 10 s nunca
    // llega a moverse, se da por llegado (movimiento muy corto).
    function esperarFinDeMovimiento(objeto) {
        let paso = 0, intentos = 0;
        const interval = setInterval(() => {
            intentos++;
            fetch("/estado_telescopio")
                .then(response => response.json())
                .then(data => {
                    if (paso === 0) {
                        if (data.slewing) {
                            paso = 1;
                            document.getElementById("status").innerHTML = `⏳ Telescopio en movimiento hacia <b>${objeto}</b>...`;
                        } else if (intentos >= 10) {
                            paso = 1;
                        }
                        return;
                    }
                    if (!data.slewing) {
                        clearInterval(interval);
                        document.getElementById("status").innerHTML = `🧭 Telescopio en <b>${objeto}</b>`;
                        document.getElementById("btnModoAutomatico").disabled = false;
                        // Llama a sendWikipediaInfo pasando el tipo almacenado
                        sendWikipediaInfo(window.tipoObjeto);
                        // El servidor arranca el centrado automático al llegar (centrar_tras_goto):
                        // engancharse a él para mostrar las vueltas y el error
                        setTimeout(() => engancharCentradoEnCurso("status", {
                            hablar: false,
                            alTerminar: () => { document.getElementById("btnModoAutomatico").disabled = false; }
                        }), 4000);
                    }
                })
                .catch(err => {
                    clearInterval(interval);
                    console.error("Error al comprobar estado del telescopio", err);
                    document.getElementById("status").innerHTML = "❌ Fallo al monitorizar el telescopio.";
                });
        }, 1000);
    }

    // Centrado automático en bucle cerrado (static/centrado.js): progreso por
    // vueltas con el error en minutos de arco y resultado final hablado.
    function lanzarModoAutomatico() {
        document.getElementById("btnModoAutomatico").disabled = true;
        iniciarCentrado("status", {
            hablar: true,
            alTerminar: () => { document.getElementById("btnModoAutomatico").disabled = false; }
        });
    }
    window.addEventListener("DOMContentLoaded", () => engancharCentradoEnCurso("status", {
        hablar: true,
        alTerminar: () => { document.getElementById("btnModoAutomatico").disabled = false; }
    }));



    // Función sendGotoRequest: se encarga de hacer la petición GOTO y guardar el tipo
    let ultimoGotoObjeto = "", ultimoGotoHora = 0;
    function sendGotoRequest() {
        const objeto = document.getElementById("objeto").value.trim();
        if (!objeto) {
            document.getElementById("status").innerHTML = "❌ Debe ingresar un objeto celeste.";
            return;
        }
        if (objeto.toLowerCase() === ultimoGotoObjeto && Date.now() - ultimoGotoHora < 10000) {
            console.log("GOTO repetido a", objeto, "ignorado");
            return;
        }
        ultimoGotoObjeto = objeto.toLowerCase(); ultimoGotoHora = Date.now();

        document.getElementById("status").innerHTML = `<span class="spinner"></span> Obteniendo datos de <b>${objeto}</b>...`;
        document.getElementById("extraInfo").innerHTML = "";
        document.getElementById("btnModoAutomatico").disabled = true;

        // Coordenadas directas (vienen de la página Esta noche); solo para ese objeto
        let cuerpo = "objeto=" + encodeURIComponent(objeto);
        if (window.coordsDirectas && window.coordsDirectas.objeto === objeto) {
            cuerpo += "&ra=" + window.coordsDirectas.ra + "&dec=" + window.coordsDirectas.dec;
        }
        fetch("/goto", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: cuerpo
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("status").innerHTML = "❌ " + data.error;
                } else if (data.warning) {
                    document.getElementById("status").innerHTML = "⚠️ " + data.warning;
                } else if (data.message) {
                    document.getElementById("status").innerHTML = data.message;
                    // Llama a esperarFinDeMovimiento para saber cuándo se ha acabado el movimiento
                    esperarFinDeMovimiento(objeto);
                } else {
                    document.getElementById("status").innerHTML = "❌ Respuesta inesperada del servidor.";
                }

                if (data.extra_info) {
                    const info = data.extra_info;
                    const icono = getIconForType(info.type);
                    let html = `<h3>${icono} Información del objeto</h3><ul>`;
                    if (info.name) html += `<li><b>Nombre:</b> ${info.name}</li>`;
                    if (info.type) html += `<li><b>Tipo:</b> ${info.type}</li>`;
                    if (info.constellation || info.iauConstellation) {
                        html += `<li><b>Constelación:</b> ${info.constellation || info.iauConstellation}</li>`;
                    }
                    const mag = info.mag ?? info.vmag ?? info.vmage;
                    if (mag !== undefined && mag !== null) {
                        html += `<li><b>Magnitud aparente:</b> ${mag.toFixed(2)}</li>`;
                    } else {
                        html += `<li><b>Magnitud aparente:</b> No disponible</li>`;
                    }
                    if (info.alt) html += `<li><b>Altitud:</b> ${info.alt.toFixed(2)}°</li>`;
                    if (info.az) html += `<li><b>Azimut:</b> ${info.az.toFixed(2)}°</li>`;
                    if (info.distance) html += `<li><b>Distancia:</b> ${info.distance.toFixed(2)}</li>`;
                    if (info.phase !== null) html += `<li><b>Fase:</b> ${(info.phase * 100).toFixed(1)}%</li>`;
                    if (info.illumination !== null) html += `<li><b>Iluminación:</b> ${(info.illumination * 100).toFixed(1)}%</li>`;
                    html += "</ul>";
                    document.getElementById("extraInfo").innerHTML = html;

                    // Mapeo para traducir el tipo (si es necesario)
                    const typeMapping = {
                        "nebula": "Nebulosa",
                        "región hii": "Nebulosa",  // en algunos casos puede venir en minúsculas o con acentos
                        "galaxy": "Galaxia",
                        "galaxia": "Galaxia",
                        "star": "Estrella",
                        "estrella": "Estrella",
                        "planet": "Planeta",
                        "planeta": "Planeta",
                        "cluster": "Cúmulo",
                        "comet": "Cometa",
                        "cometa": "Cometa",
                        "asteroid": "Asteroide",
                        "asteroide": "Asteroide",
                        "cúmulo estelar globular": "Cumulo",
                        "cúmulo estelar abierto": "Cumulo",
                    };
                    let tipo = info.type ? info.type.toLowerCase() : "";
                    if (typeMapping[tipo]) {
                        tipo = typeMapping[tipo];
                    } else if (tipo) {
                        // Capitaliza la primera letra en caso de no estar mapeado
                        tipo = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                    }
                    // Guardamos el tipo en la variable global
                    window.tipoObjeto = tipo;
                } else {
                    window.tipoObjeto = "";
                }
            })
            .catch(error => {
                document.getElementById("status").innerHTML = "❌ Error en la solicitud: " + error;
            });
    }

    function actualizarEstadoStellarium() {
        fetch("/estado_stellarium")
            .then(response => response.json())
            .then(data => {
                const div = document.getElementById("estado_stellarium");
                if (data.disponible) {
                    div.innerHTML = "🟢 <b>Stellarium disponible</b>";
                    div.style.color = "green";
                } else {
                    div.innerHTML = "🔴 <b>Stellarium no detectado</b>";
                    div.style.color = "red";
                }
            })
            .catch(error => {
                document.getElementById("estado_stellarium").innerHTML = "⚠️ Error al verificar Stellarium";
            });
    }

    // Función sendWikipediaInfo modificada para recibir el parámetro "tipo"
    function sendWikipediaInfo(tipo) {
        const objeto = document.getElementById("objeto").value.trim();
        if (!objeto) {
            document.getElementById("status").innerHTML = "❌ Debe ingresar un objeto celeste.";
            return;
        }
        let objetoBusqueda = objeto;
        if (tipo) {
            objetoBusqueda = objeto + " (" + tipo + ")";
        }

        document.getElementById("status").innerHTML = `<span class="spinner"></span> Obteniendo información de Wikipedia...`;

        fetch("/info-wikipedia", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "objeto=" + encodeURIComponent(objetoBusqueda)
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("status").innerHTML = "❌ " + data.error;
                } else if (data.wikipedia_info) {
                    let textoParaHablar = "";
                    if (tipo) {
                        textoParaHablar = `${objeto} (${tipo}): ${data.wikipedia_info}`;
                    } else {
                        textoParaHablar = `${objeto}: ${data.wikipedia_info}`;
                    }
                    document.getElementById("status").innerHTML = "✅ Información obtenida, reproduciendo...";
                    // Crear el utterance
                    var utterance = new SpeechSynthesisUtterance(textoParaHablar);
                    utterance.rate = 0.8;  // Ajusta la velocidad si es necesario
                    utterance.lang = "es-ES";
                    utterance.onend = function () {
                        document.getElementById("status").innerHTML = "✅ Resumen reproducido.";
                        // Reinicia la variable y el texto del botón al finalizar
                        infoUtterance = null;
                        document.getElementById("btnInfoAudio").innerHTML = "📢 Hablar info";
                    };
                    // Guarda el utterance para poder gestionarlo posteriormente
                    infoUtterance = utterance;
                    speechSynthesis.cancel();          // si había otra lectura en marcha, no se solapan
                    speechSynthesis.speak(utterance);
                    // Cambiar el texto del botón a "Pause info"
                    document.getElementById("btnInfoAudio").innerHTML = "⏸️ Pause info";
                }
            })
            .catch(err => {
                document.getElementById("status").innerHTML = "❌ Error en la solicitud: " + err;
            });
    }

    function toggleAudio() {
        // Verificar si ya se está reproduciendo o se tiene un audio almacenado
        if (infoUtterance && (speechSynthesis.speaking || speechSynthesis.paused)) {
            // Si el audio está pausado, reanudarlo
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                document.getElementById("btnInfoAudio").innerHTML = "⏸️ Pause info";
            } else {
                // Si el audio está sonando, pausarlo
                speechSynthesis.pause();
                document.getElementById("btnInfoAudio").innerHTML = "▶️ Resume info";
            }
        } else {
            // Si no hay audio activo, llama a sendWikipediaInfo para iniciar la reproducción
            sendWikipediaInfo(window.tipoObjeto);
        }
    }


    // Quitar el texto de ayuda de la columna derecha en cuanto haya algo que mostrar
    new MutationObserver(() => {
        const info = document.querySelector(".goto-info");
        if (info && (document.getElementById("status").textContent.trim() || document.getElementById("extraInfo").textContent.trim())) info.classList.remove("vacia");
    }).observe(document.querySelector(".goto-info"), { childList: true, subtree: true, characterData: true });

    document.addEventListener("DOMContentLoaded", function () {
        actualizarEstadoStellarium();
        setInterval(actualizarEstadoStellarium, 10000);

        // Sin HTTPS los botones de voz no van a funcionar en Chrome: avisar antes de que lo intente
        if (!window.isSecureContext) {
            const aviso = document.createElement("div");
            aviso.style.cssText = "font-size: 13px; color: #ffd580; margin: 4px 0 8px;";
            aviso.innerHTML = "🎙️ Los botones de voz necesitan que Chrome trate esta dirección como segura. " +
                "Una vez en el móvil: <code>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code>, añadir <code>" + location.origin + "</code>, activar y reiniciar Chrome. También hace falta Internet en el móvil.";
            document.getElementById("estado_stellarium").insertAdjacentElement("afterend", aviso);
        }

        // Llegada desde "Esta noche": /goto?objeto=Nombre&ra=h&dec=deg -> GOTO inmediato
        const params = new URLSearchParams(window.location.search);
        if (params.get("objeto")) {
            document.getElementById("objeto").value = params.get("objeto");
            if (params.get("ra") && params.get("dec")) {
                window.coordsDirectas = { objeto: params.get("objeto"), ra: params.get("ra"), dec: params.get("dec") };
            }
            history.replaceState(null, "", "/goto");   // que recargar no repita el GOTO
            sendGotoRequest();
        }
    });
</script>
{% endblock %}
